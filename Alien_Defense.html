<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<script type="application/mira-manifest+json">{"title":"Alien Defense"}</script>
<style>
body{font:16px system-ui;padding:16px;background:#111;color:#eee}
h1{margin:0 0 8px}
button{font:inherit;padding:12px 16px;margin:4px;background:#333;color:#fff;border:1px solid #555;border-radius:8px}
button:active{background:#555}
#status{font-family:monospace;white-space:pre;background:#222;padding:12px;border-radius:8px;min-height:80px}
label{display:block;margin:8px 0}
input[type=range]{width:100%}
</style></head>
<body><main id="mira-companion-root">
<h1>Alien Defense</h1>
<p>Destroy the formation. Scroll to move, tap to fire. Long press to recenter head.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button id="left">Left</button>
<button id="fire">Fire</button>
<button id="right">Right</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
<button id="recenter">Recenter Head</button>
<button id="newgame">New Game</button>
</div>
<div id="status">Connect and open on glasses</div>
<label><input type="checkbox" id="head" checked> Head steering</label>
<label>Horizontal head span: <span id="spanval">30</span>°
<input type="range" id="span" min="18" max="60" value="30"></label>
<label><input type="checkbox" id="invert"> Invert left/right</label>
</main>
<script>
const statusEl = document.getElementById('status');
const headEl = document.getElementById('head');
const spanEl = document.getElementById('span');
const spanVal = document.getElementById('spanval');
const invertEl = document.getElementById('invert');
let lastState = {};

function updateDisplay(s) {
  lastState = s;
  statusEl.textContent = `Score: ${s.score ?? 0}  Best: ${s.best ?? 0}\nWave: ${s.wave ?? 1}  Lives: ${s.lives ?? 3}  Aliens: ${s.aliens ?? 40}\nStatus: ${s.status ?? ''}\nHead: ${s.headEnabled ? 'ON' : 'OFF'}  Span: ${s.yawRange ?? 30}°  Invert: ${s.invertX ? 'YES' : 'NO'}`;
  if (s.headEnabled !== undefined) headEl.checked = s.headEnabled;
  if (s.yawRange != null) { spanEl.value = s.yawRange; spanVal.textContent = s.yawRange; }
  if (s.invertX !== undefined) invertEl.checked = s.invertX;
}

miraCompanion.onFromApp(function(m) {
  if (m.type === 'state') updateDisplay(m);
});

function sendAction(a) { miraCompanion.sendToApp({action: a}); }
function sendPrefs() {
  miraCompanion.sendToApp({
    type: 'prefs',
    headEnabled: headEl.checked,
    yawRange: parseInt(spanEl.value, 10),
    invertX: invertEl.checked
  });
}

document.getElementById('fire').onclick = () => sendAction('fire');
document.getElementById('recenter').onclick = () => sendAction('recenter');
document.getElementById('newgame').onclick = () => sendAction('newGame');

// Press-and-hold for left/right: immediate + ~90ms repeat
function setupHold(id, action) {
  const btn = document.getElementById(id);
  let timer = null;
  const start = () => {
    sendAction(action);
    timer = setInterval(() => sendAction(action), 90);
  };
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('pointerleave', stop);
}
setupHold('left', 'left');
setupHold('right', 'right');

headEl.onchange = sendPrefs;
spanEl.oninput = () => { spanVal.textContent = spanEl.value; sendPrefs(); };
invertEl.onchange = sendPrefs;

// Persistence
async function restoreBest() {
  try {
    let best = await miraCompanion.storeGet('alienDefenseBestV1');
    if (best == null || !isFinite(+best) || +best < 0) {
      const legacy = await miraCompanion.storeGet('miraInvadersBestV1');
      if (legacy != null && isFinite(+legacy) && +legacy >= 0) {
        best = Math.floor(Math.min(99999, Math.max(0, +legacy)));
        await miraCompanion.storeSet('alienDefenseBestV1', best);
      } else best = 0;
    } else {
      best = Math.floor(Math.min(99999, Math.max(0, +best)));
    }
    miraCompanion.sendToApp({type: 'best', best: best});
  } catch(e) {}
}
restoreBest();

// Save higher best when received
miraCompanion.onFromApp(function(m) {
  if (m.type === 'state' && m.best != null) {
    // phone can store if higher, but glasses also manages; simple store on change
    miraCompanion.storeSet('alienDefenseBestV1', m.best).catch(()=>{});
  }
});
</script>
