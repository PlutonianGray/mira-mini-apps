<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script type="application/mira-manifest+json">
  { "title": "Fleet Grid", "description": "A Battleship-style strategy game for Mira glasses.", "phoneIcon": "navigate" }
  </script>
  <style>
    body { margin:0; padding:18px; font:16px -apple-system,system-ui,sans-serif; color:#173c20; background:#f3faf4; }
    h1 { margin:0 0 4px; font-size:24px; }
    p { margin:0 0 16px; color:#66846b; line-height:1.35; }
    .card { max-width:520px; padding:16px; border:1px solid #c5dfc7; border-radius:14px; background:#fff; }
    .row { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; margin:12px 0; }
    input[type="range"] { width:220px; }
    .checks { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
    label { font-weight:600; }
    button { min-height:44px; padding:10px 14px; border:0; border-radius:10px; background:#1c7133; color:#fff; font:inherit; font-weight:700; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    #state { margin-top:16px; padding:12px; border-radius:10px; background:#f3faf4; white-space:pre-wrap; line-height:1.35; }
    small { color:#66846b; }
  </style>
</head>
<body>
<main id="mira-companion-root">
  <div class="card">
    <h1>Fleet Grid</h1>
    <p>Head-aim at the enemy grid and tap to fire. Swiping switches to manual cell-by-cell aiming. Long-press on the glasses to recenter head aiming.</p>

    <div class="row">
      <label for="yaw">Horizontal head span</label>
      <span><output id="yawOut">30</output>°</span>
    </div>
    <input id="yaw" type="range" min="18" max="50" step="1" value="30">

    <div class="row">
      <label for="pitch">Vertical head span</label>
      <span><output id="pitchOut">24</output>°</span>
    </div>
    <input id="pitch" type="range" min="14" max="40" step="1" value="24">

    <div class="checks">
      <label><input id="invertX" type="checkbox"> Invert X</label>
      <label><input id="invertY" type="checkbox"> Invert Y</label>
    </div>

    <div class="buttons">
      <button id="recenter">Recenter Aim</button>
      <button id="newGame">New Game</button>
    </div>

    <div id="state">Waiting for the glasses…</div>
    <p style="margin-top:14px"><small>Your fleet is auto-placed each game. Standard ship sizes: 5, 4, 3, 3, 2.</small></p>
  </div>
</main>

<script>
(function () {
  var yaw = document.getElementById('yaw');
  var pitch = document.getElementById('pitch');
  var invertX = document.getElementById('invertX');
  var invertY = document.getElementById('invertY');
  var yawOut = document.getElementById('yawOut');
  var pitchOut = document.getElementById('pitchOut');
  var state = document.getElementById('state');

  function sendPrefs() {
    yawOut.value = yaw.value;
    pitchOut.value = pitch.value;
    miraCompanion.sendToApp({
      type:'prefs',
      yawRange:Number(yaw.value),
      pitchRange:Number(pitch.value),
      invertX:invertX.checked,
      invertY:invertY.checked
    });
  }

  yaw.oninput = sendPrefs;
  pitch.oninput = sendPrefs;
  invertX.onchange = sendPrefs;
  invertY.onchange = sendPrefs;
  document.getElementById('recenter').onclick = function () {
    miraCompanion.sendToApp({ type:'recenter' });
  };
  document.getElementById('newGame').onclick = function () {
    miraCompanion.sendToApp({ type:'newGame' });
  };

  miraCompanion.onFromApp(function (message) {
    if (!message || message.type !== 'state') return;
    state.textContent =
      'Enemy ships: ' + message.enemyShips + '   Your ships: ' + message.yourShips + '\n' +
      'Shots: ' + message.shots + '   Hits: ' + message.hits + '\n' +
      message.last;
  });
})();
</script>

<script type="mira-app">
(function () {
  var INK = 15, MID = 8, DIM = 5;
  var SIZE = 10, CELL = 32, GX = 70, GY = 98;
  var SHIP_SIZES = [5,4,3,3,2];
  var LETTERS = 'ABCDEFGHIJ';

  var enemyFleet, playerFleet, playerShots, enemyShots;
  var cursorRow = 4, cursorCol = 4;
  var shotsTaken = 0, hitsMade = 0;
  var lastText = 'Find and sink the enemy fleet.';
  var gameOver = false;
  var aiQueue = [];
  var controlMode = 'head';

  var yawRange = 30, pitchRange = 24, invertX = false, invertY = false;
  var pointer = { baseYaw:null, basePitch:null, x:320, y:240 };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function wrap(deg) {
    while (deg > 180) deg -= 360;
    while (deg < -180) deg += 360;
    return deg;
  }
  function coord(index) {
    var r = Math.floor(index / SIZE), c = index % SIZE;
    return LETTERS.charAt(c) + String(r + 1);
  }
  function indexOfCell(r, c) { return r * SIZE + c; }

  function shuffled(values) {
    var out = values.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  function placeFleet() {
    var cells = [];
    for (var i = 0; i < SIZE * SIZE; i++) cells.push(-1);
    var ships = [];

    for (var s = 0; s < SHIP_SIZES.length; s++) {
      var len = SHIP_SIZES[s], placed = false;
      while (!placed) {
        var horizontal = Math.random() < 0.5;
        var maxR = horizontal ? SIZE : SIZE - len + 1;
        var maxC = horizontal ? SIZE - len + 1 : SIZE;
        var row = Math.floor(Math.random() * maxR);
        var col = Math.floor(Math.random() * maxC);
        var chosen = [], clear = true;

        for (var k = 0; k < len; k++) {
          var rr = row + (horizontal ? 0 : k);
          var cc = col + (horizontal ? k : 0);
          var idx = indexOfCell(rr, cc);
          if (cells[idx] !== -1) { clear = false; break; }
          chosen.push(idx);
        }
        if (!clear) continue;

        var shipId = ships.length;
        for (var p = 0; p < chosen.length; p++) cells[chosen[p]] = shipId;
        ships.push({ size:len, cells:chosen, hits:0, sunk:false });
        placed = true;
      }
    }
    return { cells:cells, ships:ships };
  }

  function shipsRemaining(fleet) {
    var n = 0;
    for (var i = 0; i < fleet.ships.length; i++) if (!fleet.ships[i].sunk) n++;
    return n;
  }

  function attack(fleet, shotMap, idx) {
    if (shotMap[idx]) return { kind:'repeat', index:idx };
    var shipId = fleet.cells[idx];
    if (shipId < 0) {
      shotMap[idx] = 1;
      return { kind:'miss', index:idx, sunk:false };
    }
    shotMap[idx] = 2;
    var ship = fleet.ships[shipId];
    ship.hits++;
    if (ship.hits >= ship.size) ship.sunk = true;
    return { kind:'hit', index:idx, sunk:ship.sunk, shipSize:ship.size };
  }

  function addAiNeighbors(idx) {
    var r = Math.floor(idx / SIZE), c = idx % SIZE;
    var candidates = [];
    if (r > 0) candidates.push(indexOfCell(r - 1, c));
    if (r < SIZE - 1) candidates.push(indexOfCell(r + 1, c));
    if (c > 0) candidates.push(indexOfCell(r, c - 1));
    if (c < SIZE - 1) candidates.push(indexOfCell(r, c + 1));
    candidates = shuffled(candidates);
    for (var i = 0; i < candidates.length; i++) {
      if (!enemyShots[candidates[i]] && aiQueue.indexOf(candidates[i]) < 0) aiQueue.push(candidates[i]);
    }
  }

  function chooseAiShot() {
    while (aiQueue.length) {
      var queued = aiQueue.shift();
      if (!enemyShots[queued]) return queued;
    }

    var parity = [], any = [];
    for (var i = 0; i < SIZE * SIZE; i++) {
      if (enemyShots[i]) continue;
      any.push(i);
      var r = Math.floor(i / SIZE), c = i % SIZE;
      if ((r + c) % 2 === 0) parity.push(i);
    }
    var pool = parity.length ? parity : any;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function computerTurn() {
    var idx = chooseAiShot();
    var result = attack(playerFleet, enemyShots, idx);
    if (result.kind === 'hit' && !result.sunk) addAiNeighbors(idx);
    if (result.sunk) aiQueue = [];
    return result;
  }

  function resetPointer() {
    pointer.baseYaw = null;
    pointer.basePitch = null;
    pointer.x = 320;
    pointer.y = 240;
    cursorRow = 4;
    cursorCol = 4;
    controlMode = 'head';
  }

  function newGame() {
    enemyFleet = placeFleet();
    playerFleet = placeFleet();
    playerShots = [];
    enemyShots = [];
    for (var i = 0; i < SIZE * SIZE; i++) { playerShots.push(0); enemyShots.push(0); }
    shotsTaken = 0;
    hitsMade = 0;
    lastText = 'Find and sink the enemy fleet.';
    gameOver = false;
    aiQueue = [];
    resetPointer();
    render();
    publish();
  }

  function updateHeadPointer() {
    if (controlMode !== 'head') return false;
    var imu = miraCanvas.getIMU(), att = imu && imu.attitude;
    if (!imu || !imu.available || imu.ageMs > 1600 || !att) return false;

    var yaw = Number.isFinite(Number(att.z_yaw)) ? Number(att.z_yaw) : Number(att.z);
    var pitch = Number.isFinite(Number(att.y_pitch)) ? Number(att.y_pitch) : Number(att.y);
    if (!Number.isFinite(yaw) || !Number.isFinite(pitch)) return false;

    if (pointer.baseYaw == null) {
      pointer.baseYaw = yaw;
      pointer.basePitch = pitch;
      pointer.x = 320;
      pointer.y = 240;
      return false;
    }

    var targetX = clamp(320 + (invertX ? -1 : 1) * wrap(yaw - pointer.baseYaw) * 640 / yawRange, 0, 640);
    var targetY = clamp(240 + (invertY ? -1 : 1) * (pitch - pointer.basePitch) * 480 / pitchRange, 0, 480);
    pointer.x += (targetX - pointer.x) * 0.35;
    pointer.y += (targetY - pointer.y) * 0.35;

    var nextCol = clamp(Math.round(pointer.x * (SIZE - 1) / 640), 0, SIZE - 1);
    var nextRow = clamp(Math.round(pointer.y * (SIZE - 1) / 480), 0, SIZE - 1);
    if (nextCol === cursorCol && nextRow === cursorRow) return false;
    cursorCol = nextCol;
    cursorRow = nextRow;
    return true;
  }

  function buildChrome() {
    return {
      kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
      children:{
        'chrome:title':{ kind:'text', x:40, y:18, w:340, h:40, text:'FLEET GRID', fill:INK, fontSize:32 },
        'chrome:rule':{ kind:'line', x1:40, y1:64, x2:600, y2:64, stroke:MID, strokeWidth:1 },
        'chrome:hint':{ kind:'text', x:36, y:432, w:568, h:34, padding:2, text:'Head aim  |  swipe manual  |  tap fire  |  hold recenter', align:'center', fill:MID, fontSize:18 }
      }
    };
  }

  function buildGrid() {
    var children = {};
    var i;
    for (i = 0; i <= SIZE; i++) {
      children['grid:v:' + i] = { kind:'line', x1:GX + i * CELL, y1:GY, x2:GX + i * CELL, y2:GY + SIZE * CELL, stroke:MID, strokeWidth:1 };
      children['grid:h:' + i] = { kind:'line', x1:GX, y1:GY + i * CELL, x2:GX + SIZE * CELL, y2:GY + i * CELL, stroke:MID, strokeWidth:1 };
    }
    for (i = 0; i < SIZE; i++) {
      children['grid:col:' + i] = { kind:'text', x:GX + i * CELL, y:68, w:CELL, h:30, text:LETTERS.charAt(i), align:'center', fill:MID, fontSize:18 };
      children['grid:row:' + i] = { kind:'text', x:36, y:GY + i * CELL + 3, w:28, h:30, text:String(i + 1), align:'right', fill:MID, fontSize:18 };
    }
    return { kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0, children:children };
  }

  function buildShots() {
    var children = {};
    for (var i = 0; i < SIZE * SIZE; i++) {
      if (!playerShots[i]) continue;
      var r = Math.floor(i / SIZE), c = i % SIZE;
      var x = GX + c * CELL, y = GY + r * CELL;
      if (playerShots[i] === 1) {
        children['shots:miss:' + i] = { kind:'circle', cx:x + 16, cy:y + 16, r:4, stroke:DIM, strokeWidth:2 };
      } else {
        children['shots:hit:a:' + i] = { kind:'line', x1:x + 7, y1:y + 7, x2:x + 25, y2:y + 25, stroke:INK, strokeWidth:3 };
        children['shots:hit:b:' + i] = { kind:'line', x1:x + 25, y1:y + 7, x2:x + 7, y2:y + 25, stroke:INK, strokeWidth:3 };
      }
    }
    return { kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0, children:children };
  }

  function buildCursor() {
    var x = GX + cursorCol * CELL + 2;
    var y = GY + cursorRow * CELL + 2;
    return { kind:'rect', x:x, y:y, w:CELL - 4, h:CELL - 4, cornerRadius:6, stroke:INK, strokeWidth:3 };
  }

  function buildSidebar() {
    var target = gameOver ? 'TAP TO RESTART' : 'TARGET ' + LETTERS.charAt(cursorCol) + String(cursorRow + 1);
    var mode = controlMode === 'head' ? 'AIM: HEAD' : 'AIM: MANUAL';
    return {
      kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
      children:{
        'side:enemyLabel':{ kind:'text', x:420, y:92, w:180, h:30, text:'ENEMY SHIPS', fill:MID, fontSize:18 },
        'side:enemyValue':{ kind:'text', x:420, y:116, w:180, h:38, text:String(shipsRemaining(enemyFleet)), fill:INK, fontSize:32 },
        'side:youLabel':{ kind:'text', x:420, y:162, w:180, h:30, text:'YOUR SHIPS', fill:MID, fontSize:18 },
        'side:youValue':{ kind:'text', x:420, y:186, w:180, h:38, text:String(shipsRemaining(playerFleet)), fill:INK, fontSize:32 },
        'side:stats':{ kind:'text', x:420, y:236, w:180, h:32, text:'SHOTS ' + shotsTaken + '  HITS ' + hitsMade, fill:MID, fontSize:18 },
        'side:last':{ kind:'text', x:420, y:276, w:180, h:82, padding:2, text:lastText, fill:INK, fontSize:18, lineSpacing:26 },
        'side:mode':{ kind:'text', x:420, y:366, w:180, h:30, text:mode, fill:MID, fontSize:18 },
        'side:target':{ kind:'text', x:420, y:394, w:180, h:30, text:target, fill:INK, fontSize:18 }
      }
    };
  }

  function render() {
    miraCanvas.draw('fleet:chrome', buildChrome());
    miraCanvas.draw('fleet:grid', buildGrid());
    miraCanvas.draw('fleet:shots', buildShots());
    miraCanvas.draw('fleet:cursor', buildCursor());
    miraCanvas.draw('fleet:sidebar', buildSidebar());
  }

  function publish() {
    miraCompanion.sendToCompanion({
      type:'state',
      enemyShips:shipsRemaining(enemyFleet),
      yourShips:shipsRemaining(playerFleet),
      shots:shotsTaken,
      hits:hitsMade,
      last:lastText
    });
  }

  function fire() {
    if (gameOver) { newGame(); return; }
    var idx = indexOfCell(cursorRow, cursorCol);
    var mine = attack(enemyFleet, playerShots, idx);
    if (mine.kind === 'repeat') {
      lastText = 'Already fired at ' + coord(idx) + '.';
      render(); publish(); return;
    }

    shotsTaken++;
    if (mine.kind === 'hit') hitsMade++;
    var first = mine.kind === 'hit' ? (mine.sunk ? 'SUNK ship at ' : 'Hit at ') : 'Miss at ';
    first += coord(idx) + '.';

    if (shipsRemaining(enemyFleet) === 0) {
      lastText = 'YOU WIN. Enemy fleet sunk.';
      gameOver = true;
      render(); publish(); return;
    }

    var theirs = computerTurn();
    var second;
    if (theirs.kind === 'hit') second = theirs.sunk ? ' Enemy sank a ship.' : ' Enemy hit ' + coord(theirs.index) + '.';
    else second = ' Enemy missed ' + coord(theirs.index) + '.';
    lastText = first + second;

    if (shipsRemaining(playerFleet) === 0) {
      lastText = 'FLEET LOST. Tap to restart.';
      gameOver = true;
    }
    render();
    publish();
  }

  function manualStep(delta) {
    if (gameOver) return;
    controlMode = 'manual';
    var idx = indexOfCell(cursorRow, cursorCol);
    idx = (idx + delta + SIZE * SIZE) % (SIZE * SIZE);
    cursorRow = Math.floor(idx / SIZE);
    cursorCol = idx % SIZE;
    render();
  }

  var off = miraCompanion.onFromCompanion(function (message) {
    if (!message) return;
    if (message.type === 'prefs') {
      if (Number.isFinite(message.yawRange)) yawRange = clamp(message.yawRange, 18, 50);
      if (Number.isFinite(message.pitchRange)) pitchRange = clamp(message.pitchRange, 14, 40);
      invertX = !!message.invertX;
      invertY = !!message.invertY;
      resetPointer();
      render();
    } else if (message.type === 'recenter') {
      resetPointer();
      lastText = 'Head aim recentered.';
      render(); publish();
    } else if (message.type === 'newGame') {
      newGame();
    }
  });

  miraCanvas.onStop(function () {
    off();
    miraCompanion.sendToCompanion({ type:'stop' });
  });

  miraCanvas.createPage({ width:640, height:480 });
  newGame();

  miraCanvas.onInput(function (event) {
    if (event.type === 'click') fire();
    else if (event.type === 'scrollTop') manualStep(-1);
    else if (event.type === 'scrollBottom') manualStep(1);
    else if (event.type === 'longClick') {
      resetPointer();
      lastText = 'Head aim recentered.';
      render(); publish();
    } else if (event.type === 'clear') {
      render(); publish();
    }
  });

  miraCanvas.animate(function () {
    if (updateHeadPointer()) render();
    return true;
  });
})();
</script>
</body>
</html>
