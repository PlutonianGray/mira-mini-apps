<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script type="application/mira-manifest+json">
  { "title": "Mira Sudoku", "description": "Play Sudoku on Mira glasses with ring, touch-bar, head selection, or phone controls.", "phoneIcon": "study" }
  </script>
  <style>
    :root { color-scheme: light; --ink:#163b20; --green:#1d7134; --soft:#edf7ef; --line:#bad7c0; --warn:#a83f32; }
    * { box-sizing:border-box; }
    body { margin:0; padding:18px; font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#f5faf6; }
    #mira-companion-root { max-width:520px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:24px; }
    .sub { margin:0 0 15px; color:#64806a; }
    .topbar, .actions, .head-controls { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
    select, button, input { min-height:42px; font:inherit; }
    select { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#fff; }
    button { padding:10px 13px; border:0; border-radius:10px; color:#fff; background:var(--green); font-weight:650; }
    button.secondary { color:var(--ink); background:#e3f1e6; }
    button:active { transform:translateY(1px); }
    #board { display:grid; grid-template-columns:repeat(9,1fr); aspect-ratio:1; margin:16px 0; border:3px solid var(--ink); background:#fff; }
    .cell { min-width:0; min-height:0; padding:0; border:0 solid #9fb9a4; border-right-width:1px; border-bottom-width:1px; border-radius:0; color:var(--green); background:#fff; font-size:clamp(17px,6vw,26px); font-weight:600; }
    .cell:nth-child(9n) { border-right-width:0; }
    .cell.given { color:var(--ink); font-weight:800; background:#f1f6f2; }
    .cell.selected { outline:3px solid var(--green); outline-offset:-3px; background:#dcefe0; }
    .cell.conflict { color:var(--warn); background:#fff0ed; }
    .cell.box-right { border-right-width:3px; border-right-color:var(--ink); }
    .cell.box-bottom { border-bottom-width:3px; border-bottom-color:var(--ink); }
    #keypad { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:12px; }
    #keypad button { padding:11px 4px; font-size:18px; }
    #status { min-height:48px; margin:12px 0; padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:#fff; white-space:pre-line; }
    .head-card { margin-top:14px; padding:13px; border-radius:12px; background:var(--soft); }
    .head-card label { display:flex; gap:8px; align-items:center; font-weight:650; }
    .head-controls { margin-top:10px; }
    .head-controls label { display:block; flex:1; min-width:135px; font-weight:400; }
    input[type="range"] { width:100%; min-height:30px; accent-color:var(--green); }
    .fine { margin:10px 0 0; color:#64806a; font-size:13px; line-height:1.4; }
  </style>
</head>
<body>
<main id="mira-companion-root">
  <h1>Mira Sudoku</h1>
  <p class="sub">Play on the glasses or use this screen as a faster keypad.</p>
  <div class="topbar">
    <select id="difficulty" aria-label="Difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new">New puzzle</button>
  </div>
  <div id="board" aria-label="Sudoku board"></div>
  <div id="keypad" aria-label="Number keypad"></div>
  <div class="actions">
    <button data-action="check">Check</button>
    <button data-action="hint" class="secondary">Hint</button>
    <button data-action="undo" class="secondary">Undo</button>
    <button data-action="erase" class="secondary">Erase</button>
  </div>
  <div id="status">Waiting for the glasses...</div>
  <section class="head-card">
    <label><input id="head" type="checkbox"> Select cells by head position</label>
    <div class="head-controls">
      <label>Horizontal range <span id="yawValue">30</span> degrees<input id="yaw" type="range" min="18" max="50" value="30"></label>
      <label>Vertical range <span id="pitchValue">24</span> degrees<input id="pitch" type="range" min="14" max="40" value="24"></label>
      <button id="recenter" class="secondary">Recenter</button>
    </div>
    <p class="fine">Smaller ranges respond to smaller head movements. Recenter while looking straight ahead.</p>
  </section>
</main>

<script>
(function () {
  var boardEl = document.getElementById('board');
  var keypadEl = document.getElementById('keypad');
  var difficultyEl = document.getElementById('difficulty');
  var headEl = document.getElementById('head');
  var yawEl = document.getElementById('yaw');
  var pitchEl = document.getElementById('pitch');
  var latest = null;

  for (var i = 0; i < 81; i++) {
    var cell = document.createElement('button');
    cell.className = 'cell';
    cell.type = 'button';
    cell.dataset.index = String(i);
    cell.setAttribute('aria-label', 'Row ' + (Math.floor(i / 9) + 1) + ', column ' + (i % 9 + 1));
    cell.onclick = function () { miraCompanion.sendToApp({ type:'select', index:Number(this.dataset.index) }); };
    boardEl.appendChild(cell);
  }
  for (var n = 1; n <= 9; n++) {
    var key = document.createElement('button');
    key.type = 'button';
    key.textContent = String(n);
    key.dataset.number = String(n);
    key.onclick = function () { miraCompanion.sendToApp({ type:'number', value:Number(this.dataset.number) }); };
    keypadEl.appendChild(key);
  }
  var zero = document.createElement('button');
  zero.type = 'button'; zero.textContent = 'Erase'; zero.className = 'secondary';
  zero.onclick = function () { miraCompanion.sendToApp({ type:'number', value:0 }); };
  keypadEl.appendChild(zero);

  function redrawPhone(state) {
    latest = state;
    difficultyEl.value = state.difficulty;
    headEl.checked = state.headSelect;
    yawEl.value = String(state.yawRange);
    pitchEl.value = String(state.pitchRange);
    document.getElementById('yawValue').textContent = String(state.yawRange);
    document.getElementById('pitchValue').textContent = String(state.pitchRange);
    var conflictSet = {};
    state.conflicts.forEach(function (index) { conflictSet[index] = true; });
    state.wrongs.forEach(function (index) { conflictSet[index] = true; });
    Array.prototype.forEach.call(boardEl.children, function (cell, index) {
      var row = Math.floor(index / 9), col = index % 9;
      cell.textContent = state.board.charAt(index) === '0' ? '' : state.board.charAt(index);
      cell.className = 'cell' +
        (state.givens.charAt(index) !== '0' ? ' given' : '') +
        (index === state.selected ? ' selected' : '') +
        (conflictSet[index] ? ' conflict' : '') +
        (col === 2 || col === 5 ? ' box-right' : '') +
        (row === 2 || row === 5 ? ' box-bottom' : '');
    });
    document.getElementById('status').textContent = state.status + '\nMoves ' + state.moves + ' · Hints ' + state.hints;
  }

  document.getElementById('new').onclick = function () {
    miraCompanion.sendToApp({ type:'new', difficulty:difficultyEl.value });
  };
  document.querySelectorAll('[data-action]').forEach(function (button) {
    button.onclick = function () { miraCompanion.sendToApp({ type:'action', action:button.dataset.action }); };
  });
  headEl.onchange = function () { miraCompanion.sendToApp({ type:'head', enabled:headEl.checked }); };
  function sendHeadConfig() {
    document.getElementById('yawValue').textContent = yawEl.value;
    document.getElementById('pitchValue').textContent = pitchEl.value;
    miraCompanion.sendToApp({ type:'headConfig', yawRange:Number(yawEl.value), pitchRange:Number(pitchEl.value) });
  }
  yawEl.onchange = sendHeadConfig;
  pitchEl.onchange = sendHeadConfig;
  document.getElementById('recenter').onclick = function () { miraCompanion.sendToApp({ type:'recenter' }); };

  var stop = miraCompanion.onFromApp(function (message) {
    if (!message) return;
    if (message.type === 'state') redrawPhone(message);
    if (message.type === 'stop') stop();
  });
})();
</script>

<script type="mira-app">
(function () {
  var INK = 15, USER = 10, MID = 8, LOW = 4;
  var GX = 28, GY = 64, CELL = 40;
  var bases = {
    easy:{
      puzzle:'530070000600195000098000060800060003400803001700020006060000280000419005000080079',
      solution:'534678912672195348198342567859761423426853791713924856961537284287419635345286179'
    },
    medium:{
      puzzle:'000260701680070090190004500820100040004602900050003028009300074040050036703018000',
      solution:'435269781682571493197834562826195347374682915951743628519326874248957136763418259'
    },
    hard:{
      puzzle:'000000907000420180000705026100904000050000040000507009920108000034059000507000000',
      solution:'462831957795426183381795426173984265659312748248567319926178534834259671517643892'
    }
  };
  var state = {
    difficulty:'easy', variant:0, puzzle:'', solution:'', board:[], givens:[], selected:40,
    editMode:false, editValue:1, moves:0, hints:0, history:[], status:'Ready', wrongs:[], solved:false,
    headSelect:false, yawRange:30, pitchRange:24
  };
  var pointer = { baseYaw:null, basePitch:null, x:320, y:240 };

  function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
  function wrap(angle) { while (angle > 180) angle -= 360; while (angle < -180) angle += 360; return angle; }
  function short(value, fallback, limit) {
    var text = value == null ? '' : String(value);
    return text.length ? text.slice(0, limit) : fallback;
  }
  function cap(text) { return text.charAt(0).toUpperCase() + text.slice(1); }

  function transformString(source, variant) {
    var shift = (variant * 2) % 9;
    var mapped = '';
    for (var i = 0; i < source.length; i++) {
      var digit = Number(source.charAt(i));
      mapped += digit ? String(((digit - 1 + shift) % 9) + 1) : '0';
    }
    if (variant % 2 === 0) return mapped;
    var transposed = '';
    for (var row = 0; row < 9; row++) {
      for (var col = 0; col < 9; col++) transposed += mapped.charAt(col * 9 + row);
    }
    return transposed;
  }

  function beginPuzzle(difficulty, advance) {
    if (!bases[difficulty]) difficulty = 'easy';
    if (advance) state.variant = (state.variant + 1) % 9;
    state.difficulty = difficulty;
    state.puzzle = transformString(bases[difficulty].puzzle, state.variant);
    state.solution = transformString(bases[difficulty].solution, state.variant);
    state.board = state.puzzle.split('').map(Number);
    state.givens = state.puzzle.split('').map(function (value) { return value !== '0'; });
    state.selected = firstEditable(40, 1);
    state.editMode = false; state.editValue = 1; state.moves = 0; state.hints = 0;
    state.history = []; state.status = cap(difficulty) + ' puzzle'; state.wrongs = []; state.solved = false;
    recenterHead(false); render(); publish();
  }

  function firstEditable(start, direction) {
    for (var step = 0; step < 81; step++) {
      var index = (start + direction * step + 810) % 81;
      if (!state.givens[index]) return index;
    }
    return start;
  }

  function moveSelection(direction) {
    state.editMode = false;
    state.selected = firstEditable(state.selected + direction, direction);
    state.status = 'Cell R' + (Math.floor(state.selected / 9) + 1) + ' C' + (state.selected % 9 + 1);
    state.wrongs = [];
  }

  function conflictIndices() {
    var flags = {};
    function markGroup(indices) {
      var seen = {};
      for (var i = 0; i < indices.length; i++) {
        var index = indices[i], value = state.board[index];
        if (!value) continue;
        if (seen[value] != null) { flags[index] = true; flags[seen[value]] = true; }
        else seen[value] = index;
      }
    }
    for (var row = 0; row < 9; row++) {
      var rowCells = [], colCells = [];
      for (var col = 0; col < 9; col++) { rowCells.push(row * 9 + col); colCells.push(col * 9 + row); }
      markGroup(rowCells); markGroup(colCells);
    }
    for (var br = 0; br < 3; br++) for (var bc = 0; bc < 3; bc++) {
      var box = [];
      for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) box.push((br * 3 + r) * 9 + bc * 3 + c);
      markGroup(box);
    }
    return Object.keys(flags).map(Number);
  }

  function setCell(index, value, source) {
    if (state.givens[index] || state.solved) { state.status = state.solved ? 'Puzzle already solved' : 'That is a fixed clue'; return false; }
    value = clamp(Math.round(Number(value) || 0), 0, 9);
    var old = state.board[index];
    if (old === value) { state.status = value ? 'No change' : 'Cell already empty'; return false; }
    state.history.push({ index:index, value:old });
    if (state.history.length > 100) state.history.shift();
    state.board[index] = value; state.moves++; state.wrongs = [];
    var conflicts = conflictIndices();
    if (conflicts.length) state.status = conflicts.length + (conflicts.length === 1 ? ' conflicting cell' : ' conflicting cells');
    else if (value === 0) state.status = 'Cell erased';
    else state.status = source === 'hint' ? 'Hint placed' : 'Number placed';
    var full = state.board.every(function (number) { return number > 0; });
    var answer = state.board.join('');
    if (full && answer === state.solution) { state.solved = true; state.editMode = false; state.status = 'Solved in ' + state.moves + ' moves'; }
    return true;
  }

  function placeValue(value) {
    if (setCell(state.selected, value, 'play')) {
      state.editMode = false;
      if (!state.solved) state.selected = firstEditable(state.selected + 1, 1);
    }
    render(); publish();
  }

  function undo() {
    if (!state.history.length || state.solved) { state.status = state.solved ? 'Solved puzzle is locked' : 'Nothing to undo'; render(); publish(); return; }
    var item = state.history.pop(); state.board[item.index] = item.value; state.selected = item.index;
    state.moves = Math.max(0, state.moves - 1); state.editMode = false; state.wrongs = []; state.status = 'Move undone';
    render(); publish();
  }

  function checkPuzzle() {
    state.wrongs = [];
    for (var i = 0; i < 81; i++) if (!state.givens[i] && state.board[i] && state.board[i] !== Number(state.solution.charAt(i))) state.wrongs.push(i);
    var blanks = state.board.filter(function (value) { return !value; }).length;
    if (state.solved) state.status = 'Puzzle is complete';
    else if (state.wrongs.length) state.status = state.wrongs.length + (state.wrongs.length === 1 ? ' incorrect entry' : ' incorrect entries');
    else if (blanks) state.status = 'So far, so good';
    else state.status = 'All entries correct';
    render(); publish();
  }

  function giveHint() {
    if (state.solved) { state.status = 'Puzzle is complete'; render(); publish(); return; }
    var index = state.selected;
    if (state.givens[index] || state.board[index] === Number(state.solution.charAt(index))) {
      for (var step = 1; step <= 81; step++) {
        var candidate = (state.selected + step) % 81;
        if (!state.givens[candidate] && state.board[candidate] !== Number(state.solution.charAt(candidate))) { index = candidate; break; }
      }
    }
    state.selected = index;
    if (setCell(index, Number(state.solution.charAt(index)), 'hint')) state.hints++;
    render(); publish();
  }

  function buildChrome() {
    return {
      kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
      children:{
        'sudoku:chrome:title':{ kind:'text', x:28, y:18, w:190, h:32, text:'SUDOKU', fill:INK, fontSize:24 },
        'sudoku:chrome:level':{ kind:'text', x:214, y:18, w:174, h:32, text:cap(state.difficulty) + '  ' + (state.variant + 1) + '/9', align:'right', fill:MID, fontSize:18 }
      }
    };
  }

  function buildBoard() {
    var children = {};
    var conflicts = {};
    conflictIndices().forEach(function (index) { conflicts[index] = true; });
    state.wrongs.forEach(function (index) { conflicts[index] = true; });
    for (var i = 0; i < 81; i++) if (conflicts[i]) {
      var cr = Math.floor(i / 9), cc = i % 9;
      children['sudoku:flag:' + i] = { kind:'rect', x:GX + cc * CELL + 2, y:GY + cr * CELL + 2, w:CELL - 4, h:CELL - 4, fill:LOW };
    }
    var sr = Math.floor(state.selected / 9), sc = state.selected % 9;
    children['sudoku:selection'] = {
      kind:'rect', x:GX + sc * CELL + 2, y:GY + sr * CELL + 2, w:CELL - 4, h:CELL - 4,
      cornerRadius:6, fill:state.editMode ? 6 : 3, stroke:INK, strokeWidth:2
    };
    for (var line = 0; line <= 9; line++) {
      var weight = line % 3 === 0 ? 3 : 1;
      children['sudoku:grid:v:' + line] = { kind:'line', x1:GX + line * CELL, y1:GY, x2:GX + line * CELL, y2:GY + 360, stroke:INK, strokeWidth:weight };
      children['sudoku:grid:h:' + line] = { kind:'line', x1:GX, y1:GY + line * CELL, x2:GX + 360, y2:GY + line * CELL, stroke:INK, strokeWidth:weight };
    }
    for (var index = 0; index < 81; index++) if (state.board[index]) {
      var row = Math.floor(index / 9), col = index % 9;
      children['sudoku:number:' + index] = {
        kind:'text', x:GX + col * CELL + 2, y:GY + row * CELL + 4, w:CELL - 4, h:32,
        text:String(state.board[index]), align:'center', fill:state.givens[index] || index === state.selected ? INK : USER, fontSize:24
      };
    }
    return { kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0, children:children };
  }

  function buildSide() {
    var mode = state.solved ? 'SOLVED' : state.editMode ? 'CHOOSE NUMBER' : 'SELECT CELL';
    var centerText = state.editMode ? (state.editValue === 0 ? 'ERASE' : String(state.editValue)) : 'R' + (Math.floor(state.selected / 9) + 1) + ' C' + (state.selected % 9 + 1);
    var instructions = state.solved ? 'Puzzle complete\nPhone: new game\nTap: review board\nWell played' :
      state.editMode ? 'Scroll: number\nTap: place\nLong: cancel\n0 means erase' :
      'Scroll: move\nTap: edit\nLong: erase\nPhone: full control';
    return {
      kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
      children:{
        'sudoku:side:mode':{ kind:'text', x:420, y:70, w:180, h:28, text:mode, align:'center', fill:MID, fontSize:18 },
        'sudoku:side:card':{ kind:'rect', x:430, y:116, w:160, h:82, cornerRadius:12, stroke:INK, strokeWidth:2 },
        'sudoku:side:value':{ kind:'text', x:438, y:132, w:144, h:46, text:centerText, align:'center', fill:INK, fontSize:centerText.length > 2 ? 24 : 40 },
        'sudoku:side:count':{ kind:'text', x:420, y:214, w:180, h:28, text:'Moves ' + state.moves + '  Hints ' + state.hints, align:'center', fill:MID, fontSize:18 },
        'sudoku:side:status':{ kind:'text', x:420, y:254, w:180, h:60, padding:4, text:short(state.status, 'Ready', 32), align:'center', fill:INK, fontSize:18, lineSpacing:26 },
        'sudoku:side:instructions':{ kind:'text', x:420, y:328, w:180, h:112, padding:4, text:instructions, align:'center', fill:MID, fontSize:18, lineSpacing:26 }
      }
    };
  }

  function render() {
    var trees = [
      { key:'sudoku:chrome', shape:buildChrome() },
      { key:'sudoku:board', shape:buildBoard() },
      { key:'sudoku:side', shape:buildSide() }
    ];
    for (var i = 0; i < trees.length; i++) miraCanvas.draw(trees[i].key, trees[i].shape);
  }

  function publish() {
    miraCompanion.sendToCompanion({
      type:'state', board:state.board.join(''), givens:state.puzzle, selected:state.selected,
      difficulty:state.difficulty, variant:state.variant, status:state.status, moves:state.moves, hints:state.hints,
      conflicts:conflictIndices(), wrongs:state.wrongs.slice(), solved:state.solved, headSelect:state.headSelect,
      yawRange:state.yawRange, pitchRange:state.pitchRange
    });
  }

  function recenterHead(showStatus) {
    pointer.baseYaw = null; pointer.basePitch = null; pointer.x = 320; pointer.y = 240;
    if (showStatus) { state.status = 'Head position recentered'; render(); publish(); }
  }

  function updateHeadSelection() {
    var imu = miraCanvas.getIMU(), att = imu && imu.attitude;
    if (!state.headSelect || state.editMode || !imu || !imu.available || imu.ageMs > 1600 || !att) return false;
    var yawValue = Number.isFinite(Number(att.z_yaw)) ? Number(att.z_yaw) : Number(att.z);
    var pitchValue = Number.isFinite(Number(att.y_pitch)) ? Number(att.y_pitch) : Number(att.y);
    if (!Number.isFinite(yawValue) || !Number.isFinite(pitchValue)) return false;
    if (pointer.baseYaw == null) {
      pointer.baseYaw = yawValue; pointer.basePitch = pitchValue; pointer.x = 320; pointer.y = 240;
      state.selected = firstEditable(40, 1); render(); publish(); return true;
    }
    var targetX = clamp(320 + wrap(yawValue - pointer.baseYaw) * 640 / state.yawRange, 0, 640);
    var targetY = clamp(240 + (pitchValue - pointer.basePitch) * 480 / state.pitchRange, 0, 480);
    pointer.x += (targetX - pointer.x) * 0.35; pointer.y += (targetY - pointer.y) * 0.35;
    var col = clamp(Math.round(pointer.x * 8 / 640), 0, 8);
    var row = clamp(Math.round(pointer.y * 8 / 480), 0, 8);
    var index = row * 9 + col;
    if (index !== state.selected) {
      state.selected = index; state.status = state.givens[index] ? 'Fixed clue' : 'Cell R' + (row + 1) + ' C' + (col + 1);
      state.wrongs = []; render(); publish(); return true;
    }
    return false;
  }

  function handleAction(action) {
    if (action === 'check') checkPuzzle();
    else if (action === 'hint') giveHint();
    else if (action === 'undo') undo();
    else if (action === 'erase') placeValue(0);
  }

  var off = miraCompanion.onFromCompanion(function (message) {
    if (!message) return;
    if (message.type === 'select') {
      state.selected = clamp(Math.round(Number(message.index) || 0), 0, 80); state.editMode = false;
      state.status = state.givens[state.selected] ? 'Fixed clue' : 'Cell selected'; state.wrongs = []; render(); publish();
    } else if (message.type === 'number') placeValue(message.value);
    else if (message.type === 'action') handleAction(message.action);
    else if (message.type === 'new') beginPuzzle(message.difficulty, true);
    else if (message.type === 'head') {
      state.headSelect = !!message.enabled; recenterHead(false); state.status = state.headSelect ? 'Head selection on' : 'Head selection off'; render(); publish();
    } else if (message.type === 'headConfig') {
      state.yawRange = clamp(Math.round(Number(message.yawRange) || 30), 18, 50);
      state.pitchRange = clamp(Math.round(Number(message.pitchRange) || 24), 14, 40); recenterHead(false); publish();
    } else if (message.type === 'recenter') recenterHead(true);
  });

  miraCanvas.createPage({ width:640, height:480 });
  beginPuzzle('easy', false);
  miraCanvas.animate(function () { updateHeadSelection(); return true; });
  miraCanvas.onInput(function (event) {
    if (event.type === 'scrollTop' || event.type === 'scrollBottom') {
      var direction = event.type === 'scrollBottom' ? 1 : -1;
      if (state.editMode) {
        state.editValue = (state.editValue + direction + 10) % 10;
        state.status = state.editValue ? 'Choose ' + state.editValue : 'Choose erase';
      } else {
        if (state.headSelect) { state.headSelect = false; state.status = 'Head selection off'; }
        moveSelection(direction);
      }
      render(); publish();
    } else if (event.type === 'click') {
      if (state.solved) { state.status = 'Solved puzzle'; render(); publish(); }
      else if (state.editMode) placeValue(state.editValue);
      else if (state.givens[state.selected]) { state.status = 'That is a fixed clue'; render(); publish(); }
      else { state.editMode = true; state.editValue = state.board[state.selected] || 1; state.status = 'Choose a number'; render(); publish(); }
    } else if (event.type === 'longClick') {
      if (state.editMode) { state.editMode = false; state.status = 'Entry cancelled'; render(); publish(); }
      else placeValue(0);
    } else if (event.type === 'clear') render();
  });
  miraCanvas.onStop(function () { off(); miraCompanion.sendToCompanion({ type:'stop' }); });
})();
</script>
</body>
</html>
