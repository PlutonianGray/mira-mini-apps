<h1>Lunar Descent</h1>
<p>On the ring/touch bar: swipe one way or the other to rotate, tap for a short engine burst, and hold for sustained thrust. On the phone, hold Thrust for a continuous burn.</p>
<div class="controls"><button data-action="left">Rotate left</button><button data-action="thrust">Thrust</button><button data-action="right">Rotate right</button></div>
<div class="controls" style="grid-template-columns:1fr 1fr"><button class="secondary" data-action="start">Start / next</button><button class="secondary" data-action="restart">Restart run</button></div>
<div id="state">Waiting for the glasses...</div></main>

 var thrustPressStamp=null,thrustPointerId=null,buttons=document.querySelectorAll('[data-action]');
 for(var i=0;i<buttons.length;i++){
  var button=buttons[i];
  if(button.getAttribute('data-action')==='thrust'){
   button.onpointerdown=function(event){if(!event||thrustPointerId!==null)return;if(typeof event.preventDefault==='function')event.preventDefault();thrustPointerId=Number(event.pointerId);thrustPressStamp=Number.isFinite(Number(event.timeStamp))?Number(event.timeStamp):null;if(typeof this.setPointerCapture==='function'&&Number.isFinite(thrustPointerId)){try{this.setPointerCapture(thrustPointerId);}catch(_){}}send('thrustStart');};
   button.onpointerup=function(event){if(!event||Number(event.pointerId)!==thrustPointerId)return;var releaseStamp=Number.isFinite(Number(event.timeStamp))?Number(event.timeStamp):null;var shortPress=thrustPressStamp!==null&&releaseStamp!==null&&releaseStamp-thrustPressStamp>=0&&releaseStamp-thrustPressStamp<250;thrustPointerId=null;thrustPressStamp=null;send('thrustEnd');if(shortPress)send('thrust');};
   button.onpointercancel=function(event){if(!event||Number(event.pointerId)!==thrustPointerId)return;thrustPointerId=null;thrustPressStamp=null;send('thrustEnd');};
   button.onlostpointercapture=function(event){if(!event||Number(event.pointerId)!==thrustPointerId)return;thrustPointerId=null;thrustPressStamp=null;send('thrustEnd');};
  }else button.onclick=function(){send(this.getAttribute('data-action'));};
 }
 miraCompanion.onFromApp(function(message){if(!message)return;if(message.type==='state')document.getElementById('state').textContent=message.text;if(message.type==='best')saveBest(message.n);});
 loadBest();
 send('sync');
 sendStoredBest();
})();
</script>
