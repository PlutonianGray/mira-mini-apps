<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script type="application/mira-manifest+json">
  { "title": "Minesweeper", "description": "Classic Minesweeper for Mira glasses", "phoneIcon": "sweep" }
  </script>
  <style>
    body {
      margin: 0;
      padding: 18px;
      font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #173c20;
      background: #f3faf4;
    }
    h1 { margin: 0 0 5px; font-size: 24px; }
    p { margin: 0 0 16px; color: #66846b; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    button, select, input { font: inherit; }
    button {
      min-height: 44px;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: #1c7133;
      color: white;
      font-weight: 650;
    }
    label {
      display: block;
      margin-top: 14px;
      color: #355d3d;
      font-weight: 600;
    }
    input[type="range"] { width: 100%; }
    .checks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .checks label {
      margin: 0;
      padding: 9px;
      border: 1px solid #c5dfc7;
      border-radius: 9px;
      background: white;
      font-weight: 500;
    }
    #state {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #c5dfc7;
      border-radius: 11px;
      background: white;
      white-space: pre-wrap;
      color: #355d3d;
    }
  </style>
</head>
<body>
  <main id="mira-companion-root">
    <h1>Minesweeper</h1>
    <p>Settings and backup controls for the glasses game.</p>

    <div class="grid">
      <button id="newGame">New game</button>
      <button id="recenter">Recenter head pointer</button>
    </div>

    <label for="yaw">Horizontal head range: <span id="yawValue">30</span>°</label>
    <input id="yaw" type="range" min="16" max="50" step="1" value="30">

    <label for="pitch">Vertical head range: <span id="pitchValue">24</span>°</label>
    <input id="pitch" type="range" min="14" max="40" step="1" value="24">

    <div class="checks">
      <label><input id="pointer" type="checkbox" checked> Head pointer</label>
      <label><input id="invertX" type="checkbox"> Invert X</label>
      <label><input id="invertY" type="checkbox"> Invert Y</label>
    </div>

    <div id="state">Waiting for the glasses…</div>
  </main>

  <script>
  (function () {
    const yaw = document.getElementById('yaw');
    const pitch = document.getElementById('pitch');
    const yawValue = document.getElementById('yawValue');
    const pitchValue = document.getElementById('pitchValue');
    const pointer = document.getElementById('pointer');
    const invertX = document.getElementById('invertX');
    const invertY = document.getElementById('invertY');
    const state = document.getElementById('state');

    function sendSettings() {
      miraCompanion.sendToApp({
        type: 'settings',
        yawRange: Number(yaw.value),
        pitchRange: Number(pitch.value),
        pointerEnabled: pointer.checked,
        invertX: invertX.checked,
        invertY: invertY.checked
      });
    }

    yaw.oninput = function () { yawValue.textContent = yaw.value; sendSettings(); };
    pitch.oninput = function () { pitchValue.textContent = pitch.value; sendSettings(); };
    pointer.onchange = sendSettings;
    invertX.onchange = sendSettings;
    invertY.onchange = sendSettings;

    document.getElementById('newGame').onclick = function () {
      miraCompanion.sendToApp({ type: 'newGame' });
    };

    document.getElementById('recenter').onclick = function () {
      miraCompanion.sendToApp({ type: 'recenter' });
    };

    const stop = miraCompanion.onFromApp(function (message) {
      if (!message) return;
      if (message.type === 'state') {
        state.textContent =
          message.status + '\n' +
          'Mines left: ' + message.minesLeft +
          ' · Revealed: ' + message.revealed + '/' + message.safeCells + '\n' +
          (message.pointerAvailable ? 'Head pointer available' : 'Head pointer unavailable — use swipe');
      }
      if (message.type === 'stop') stop();
    });
  })();
  </script>

  <script type="mira-app">
  (function () {
    var INK = 15, MID = 8, DIM = 4;
    var COLS = 9, ROWS = 9, MINES = 10;
    var CELL = 40, BOARD_X = 140, BOARD_Y = 64;
    var TOTAL = COLS * ROWS, SAFE = TOTAL - MINES;

    var board = [];
    var minesPlaced = false;
    var gameState = 'ready'; // ready, playing, won, lost
    var selectedRow = 4, selectedCol = 4;
    var revealedCount = 0, flagCount = 0;

    var yawRange = 30, pitchRange = 24;
    var invertX = false, invertY = false, pointerEnabled = true;
    var pointerAvailable = false;
    var pointer = { baseYaw:null, basePitch:null, x:320, y:240 };
    var manualFrames = 0;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function wrap(angle) {
      while (angle > 180) angle -= 360;
      while (angle < -180) angle += 360;
      return angle;
    }

    function idx(r, c) { return r * COLS + c; }

    function cellAt(r, c) {
      return (r >= 0 && r < ROWS && c >= 0 && c < COLS) ? board[idx(r, c)] : null;
    }

    function resetPointer() {
      pointer.baseYaw = null;
      pointer.basePitch = null;
      pointer.x = 320;
      pointer.y = 240;
    }

    function resetGame() {
      board = [];
      for (var i = 0; i < TOTAL; i++) {
        board.push({ mine:false, count:0, revealed:false, flagged:false });
      }
      minesPlaced = false;
      gameState = 'ready';
      selectedRow = 4;
      selectedCol = 4;
      revealedCount = 0;
      flagCount = 0;
      manualFrames = 0;
      resetPointer();
      render();
      publish();
    }

    function shuffledCandidates(firstRow, firstCol) {
      var candidates = [];
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          // Keep the first tapped cell and its immediate neighbors mine-free.
          if (Math.abs(r - firstRow) <= 1 && Math.abs(c - firstCol) <= 1) continue;
          candidates.push(idx(r, c));
        }
      }

      for (var i = candidates.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = candidates[i];
        candidates[i] = candidates[j];
        candidates[j] = t;
      }
      return candidates;
    }

    function placeMines(firstRow, firstCol) {
      var candidates = shuffledCandidates(firstRow, firstCol);
      for (var i = 0; i < MINES; i++) board[candidates[i]].mine = true;

      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var cell = cellAt(r, c);
          if (cell.mine) continue;
          var count = 0;
          for (var dr = -1; dr <= 1; dr++) {
            for (var dc = -1; dc <= 1; dc++) {
              if (!dr && !dc) continue;
              var n = cellAt(r + dr, c + dc);
              if (n && n.mine) count++;
            }
          }
          cell.count = count;
        }
      }

      minesPlaced = true;
      gameState = 'playing';
    }

    function revealFlood(startRow, startCol) {
      var queue = [[startRow, startCol]];
      var seen = {};

      while (queue.length) {
        var item = queue.shift();
        var r = item[0], c = item[1];
        var k = r + ':' + c;
        if (seen[k]) continue;
        seen[k] = true;

        var cell = cellAt(r, c);
        if (!cell || cell.revealed || cell.flagged || cell.mine) continue;

        cell.revealed = true;
        revealedCount++;

        if (cell.count === 0) {
          for (var dr = -1; dr <= 1; dr++) {
            for (var dc = -1; dc <= 1; dc++) {
              if (!dr && !dc) continue;
              var nr = r + dr, nc = c + dc;
              var n = cellAt(nr, nc);
              if (n && !n.revealed && !n.flagged && !n.mine) queue.push([nr, nc]);
            }
          }
        }
      }
    }

    function checkWin() {
      if (revealedCount !== SAFE) return false;
      gameState = 'won';
      for (var i = 0; i < TOTAL; i++) {
        if (board[i].mine && !board[i].flagged) {
          board[i].flagged = true;
          flagCount++;
        }
      }
      return true;
    }

    function revealSelected() {
      if (gameState === 'won' || gameState === 'lost') {
        resetGame();
        return;
      }

      var cell = cellAt(selectedRow, selectedCol);
      if (!cell || cell.flagged || cell.revealed) return;

      if (!minesPlaced) placeMines(selectedRow, selectedCol);

      cell = cellAt(selectedRow, selectedCol);
      if (cell.mine) {
        cell.revealed = true;
        gameState = 'lost';
      } else {
        revealFlood(selectedRow, selectedCol);
        checkWin();
      }

      render();
      publish();
    }

    function toggleFlag() {
      if (gameState === 'won' || gameState === 'lost') return;
      var cell = cellAt(selectedRow, selectedCol);
      if (!cell || cell.revealed) return;

      if (cell.flagged) {
        cell.flagged = false;
        flagCount--;
      } else if (flagCount < MINES) {
        cell.flagged = true;
        flagCount++;
      }

      render();
      publish();
    }

    function moveLinear(delta) {
      var current = idx(selectedRow, selectedCol);
      var next = (current + delta + TOTAL) % TOTAL;
      selectedRow = Math.floor(next / COLS);
      selectedCol = next % COLS;
      manualFrames = 18;
      render();
    }

    function statusText() {
      if (gameState === 'ready') return 'TAP TO START';
      if (gameState === 'won') return 'BOARD CLEARED';
      if (gameState === 'lost') return 'MINE HIT';
      return 'CLEAR THE FIELD';
    }

    function publish() {
      miraCompanion.sendToCompanion({
        type: 'state',
        status: statusText(),
        minesLeft: Math.max(0, MINES - flagCount),
        revealed: revealedCount,
        safeCells: SAFE,
        pointerAvailable: pointerAvailable
      });
    }

    function makeDigitBitmap(n) {
      var patterns = {
        1:["010","110","010","010","111"],
        2:["110","001","010","100","111"],
        3:["110","001","010","001","110"],
        4:["101","101","111","001","001"],
        5:["111","100","110","001","110"],
        6:["011","100","111","101","111"],
        7:["111","001","010","010","010"],
        8:["111","101","111","101","111"]
      };
      var p = patterns[n], scaleX = 4, scaleY = 4, w = 12, h = 20, pixels = [];
      var level = 14;
      for (var py = 0; py < 5; py++) {
        for (var sy = 0; sy < scaleY; sy++) {
          for (var px = 0; px < 3; px++) {
            var on = p[py].charAt(px) === '1';
            for (var sx = 0; sx < scaleX; sx++) pixels.push(on ? level : 15);
          }
        }
      }
      return { w:w, h:h, pixels:pixels };
    }

    var DIGITS = {};
    for (var d = 1; d <= 8; d++) DIGITS[d] = makeDigitBitmap(d);

    function buildReveals() {
      var children = {};
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var cell = cellAt(r, c);
          if (!cell.revealed && !(gameState === 'lost' && cell.mine)) continue;

          var x = BOARD_X + c * CELL;
          var y = BOARD_Y + r * CELL;

          if (cell.revealed && !cell.mine) {
            children['ms:reveal:' + r + ':' + c] = {
              kind:'rect', x:x + 1, y:y + 1, w:CELL - 2, h:CELL - 2, fill:2
            };
          }

          if (cell.mine && (cell.revealed || gameState === 'lost')) {
            children['ms:mine:' + r + ':' + c] = {
              kind:'circle', cx:x + 20, cy:y + 20, r:9, fill:INK
            };
          }
        }
      }

      return {
        kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
        children:children
      };
    }

    function buildGrid() {
      var children = {};
      for (var r = 0; r <= ROWS; r++) {
        var y = BOARD_Y + r * CELL;
        children['ms:grid:h:' + r] = {
          kind:'line', x1:BOARD_X, y1:y, x2:BOARD_X + COLS * CELL, y2:y,
          stroke:MID, strokeWidth:(r === 0 || r === ROWS) ? 2 : 1
        };
      }
      for (var c = 0; c <= COLS; c++) {
        var x = BOARD_X + c * CELL;
        children['ms:grid:v:' + c] = {
          kind:'line', x1:x, y1:BOARD_Y, x2:x, y2:BOARD_Y + ROWS * CELL,
          stroke:MID, strokeWidth:(c === 0 || c === COLS) ? 2 : 1
        };
      }

      return {
        kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
        children:children
      };
    }

    function buildMarks() {
      var children = {};

      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var cell = cellAt(r, c);
          var x = BOARD_X + c * CELL;
          var y = BOARD_Y + r * CELL;

          if (cell.revealed && !cell.mine && cell.count > 0) {
            children['ms:number:' + r + ':' + c] = {
              kind:'sprite', x:x + 14, y:y + 10, bitmap:DIGITS[cell.count]
            };
          }

          if (cell.flagged && !(gameState === 'lost' && cell.mine)) {
            children['ms:flag:pole:' + r + ':' + c] = {
              kind:'line', x1:x + 17, y1:y + 10, x2:x + 17, y2:y + 30,
              stroke:INK, strokeWidth:2
            };
            children['ms:flag:cloth:' + r + ':' + c] = {
              kind:'triangle',
              x1:x + 18, y1:y + 10,
              x2:x + 31, y2:y + 16,
              x3:x + 18, y3:y + 21,
              fill:INK
            };
          }

          if (gameState === 'lost' && cell.flagged && !cell.mine) {
            children['ms:badflag:a:' + r + ':' + c] = {
              kind:'line', x1:x + 10, y1:y + 10, x2:x + 30, y2:y + 30,
              stroke:INK, strokeWidth:2
            };
            children['ms:badflag:b:' + r + ':' + c] = {
              kind:'line', x1:x + 30, y1:y + 10, x2:x + 10, y2:y + 30,
              stroke:INK, strokeWidth:2
            };
          }
        }
      }

      return {
        kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
        children:children
      };
    }

    function buildChrome() {
      var mineText = 'MINES ' + Math.max(0, MINES - flagCount);
      return {
        kind:'rect', x:0, y:0, w:0, h:0, stroke:0, strokeWidth:0,
        children:{
          'ms:chrome:title': {
            kind:'text', x:20, y:12, w:210, h:32,
            text:'MINESWEEPER', fill:INK, fontSize:24
          },
          'ms:chrome:status': {
            kind:'text', x:232, y:14, w:236, h:28,
            text:statusText(), align:'center', fill:MID, fontSize:18
          },
          'ms:chrome:mines': {
            kind:'text', x:480, y:14, w:140, h:28,
            text:mineText, align:'right', fill:INK, fontSize:18
          },
          'ms:chrome:hint': {
            kind:'text', x:20, y:438, w:600, h:30,
            text:'Tap reveal · long press flag · swipe move',
            align:'center', fill:MID, fontSize:18
          }
        }
      };
    }

    function buildCursor() {
      var x = BOARD_X + selectedCol * CELL + 3;
      var y = BOARD_Y + selectedRow * CELL + 3;
      return {
        kind:'rect', x:x, y:y, w:CELL - 6, h:CELL - 6,
        cornerRadius:7, stroke:INK, strokeWidth:3
      };
    }

    function render() {
      // Complete visible scene, back to front.
      miraCanvas.draw('ms:reveals', buildReveals());
      miraCanvas.draw('ms:grid', buildGrid());
      miraCanvas.draw('ms:marks', buildMarks());
      miraCanvas.draw('ms:chrome', buildChrome());
      miraCanvas.draw('ms:cursor', buildCursor());
    }

    function updateHeadPointer() {
      if (!pointerEnabled || manualFrames > 0) return false;

      var imu = miraCanvas.getIMU();
      var att = imu && imu.attitude;
      if (!imu || !imu.available || imu.ageMs > 1600 || !att) {
        pointerAvailable = false;
        return false;
      }

      var yawRaw = Number.isFinite(Number(att.z_yaw)) ? Number(att.z_yaw) : Number(att.z);
      var pitchRaw = Number.isFinite(Number(att.y_pitch)) ? Number(att.y_pitch) : Number(att.y);
      if (!Number.isFinite(yawRaw) || !Number.isFinite(pitchRaw)) {
        pointerAvailable = false;
        return false;
      }

      pointerAvailable = true;

      if (pointer.baseYaw == null) {
        pointer.baseYaw = yawRaw;
        pointer.basePitch = pitchRaw;
        pointer.x = 320;
        pointer.y = 240;
        return false;
      }

      var targetX = clamp(
        320 + (invertX ? -1 : 1) * wrap(yawRaw - pointer.baseYaw) * 640 / yawRange,
        0, 640
      );
      var targetY = clamp(
        240 + (invertY ? -1 : 1) * (pitchRaw - pointer.basePitch) * 480 / pitchRange,
        0, 480
      );

      pointer.x += (targetX - pointer.x) * 0.35;
      pointer.y += (targetY - pointer.y) * 0.35;

      var col = Math.round(pointer.x * (COLS - 1) / 640);
      var row = Math.round(pointer.y * (ROWS - 1) / 480);

      col = clamp(col, 0, COLS - 1);
      row = clamp(row, 0, ROWS - 1);

      if (row !== selectedRow || col !== selectedCol) {
        selectedRow = row;
        selectedCol = col;
        return true;
      }
      return false;
    }

    var off = miraCompanion.onFromCompanion(function (message) {
      if (!message) return;

      if (message.type === 'newGame') {
        resetGame();
        return;
      }

      if (message.type === 'recenter') {
        resetPointer();
        selectedRow = 4;
        selectedCol = 4;
        render();
        return;
      }

      if (message.type === 'settings') {
        if (Number.isFinite(Number(message.yawRange))) yawRange = clamp(Number(message.yawRange), 16, 50);
        if (Number.isFinite(Number(message.pitchRange))) pitchRange = clamp(Number(message.pitchRange), 14, 40);
        pointerEnabled = message.pointerEnabled !== false;
        invertX = !!message.invertX;
        invertY = !!message.invertY;
        resetPointer();
        selectedRow = 4;
        selectedCol = 4;
        render();
      }
    });

    miraCanvas.onStop(function () {
      off();
      miraCompanion.sendToCompanion({ type:'stop' });
    });

    miraCanvas.createPage({ width:640, height:480 });
    resetGame();

    miraCanvas.onInput(function (event) {
      if (event.type === 'click') revealSelected();
      if (event.type === 'longClick') toggleFlag();
      if (event.type === 'scrollTop') moveLinear(-1);
      if (event.type === 'scrollBottom') moveLinear(1);
      if (event.type === 'clear') render();
    });

    miraCanvas.animate(function () {
      if (manualFrames > 0) manualFrames--;
      if (updateHeadPointer()) render();
      return true;
    });
  })();
  </script>
</body>
</html>
