<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script type="application/mira-manifest+json">{"title":"Fleet Grid","description":"A Battleship-style strategy game for Mira glasses.","phoneIcon":"navigate"}</script>
<style>
:root{--ink:#173c20;--muted:#66846b;--line:#c5dfc7;--paper:#f3faf4;--card:#fff;--forest:#1c7133;--water:#e4f0e6;--hit:#0e3a1a}
body{margin:0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom));font:16px -apple-system,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1{margin:0 0 4px;font-size:24px}p{margin:0 0 16px;color:var(--muted);line-height:1.35}.card{max-width:520px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:12px 0 4px}input[type=range]{width:100%;accent-color:var(--forest)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}label{font-weight:600}.checks label{display:flex;align-items:center;gap:8px;min-height:44px}
button{min-height:44px;padding:10px 14px;border:0;border-radius:12px;background:var(--forest);color:#fff;font:inherit;font-weight:700}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.buttons #fire{grid-column:1/-1}
#state{margin-top:16px;padding:12px;border-radius:12px;background:var(--paper);white-space:pre-wrap;line-height:1.35}.waters-wrap{margin-top:16px}.waters-wrap h2{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.waters{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(100%,280px)}.waters i{aspect-ratio:1;border-radius:3px;background:var(--water);display:block}.waters i.c1{background:var(--forest)}.waters i.c2{background:#c5d7c8}.waters i.c3{background:var(--hit)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}.legend .ship{background:var(--forest)}.legend .miss{background:#c5d7c8}.legend .hit{background:var(--hit)}small{color:var(--muted)}
</style>
</head>
<body>
<main id="mira-companion-root"><div class="card">
<h1>Fleet Grid</h1>
<p>Head-aim at the enemy grid and tap to fire. Swipe to step cell by cell. Long-press on the glasses to recenter head aiming.</p>
<div class="row"><label for="yaw">Horizontal head span</label><span><output id="yawOut">30</output>°</span></div>
<input id="yaw" type="range" min="18" max="50" step="1" value="30">
<div class="row"><label for="pitch">Vertical head span</label><span><output id="pitchOut">24</output>°</span></div>
<input id="pitch" type="range" min="14" max="40" step="1" value="24">
<div class="checks"><label><input id="invertX" type="checkbox"> Invert X</label><label><input id="invertY" type="checkbox"> Invert Y</label></div>
<div class="buttons"><button id="recenter" type="button">Recenter Aim</button><button id="newGame" type="button">New Game</button><button id="fire" type="button">Fire</button></div>
<div id="state">Waiting for the glasses…</div>
<div class="waters-wrap"><h2>Your waters</h2><div id="waters" class="waters" aria-label="Your fleet and incoming fire"></div><div class="legend"><span><i class="ship"></i> Ship</span><span><i class="hit"></i> Hit</span><span><i class="miss"></i> Miss</span></div></div>
<p style="margin-top:14px"><small>Your fleet is auto-placed each game. Standard ship sizes: 5, 4, 3, 3, 2.</small></p>
</div></main>
<script>
(function(){
 var yaw=document.getElementById('yaw'),pitch=document.getElementById('pitch'),invertX=document.getElementById('invertX'),invertY=document.getElementById('invertY'),yawOut=document.getElementById('yawOut'),pitchOut=document.getElementById('pitchOut'),state=document.getElementById('state'),waters=document.getElementById('waters');
 function send(message){try{var p=miraCompanion.sendToApp(message);if(p&&typeof p.catch==='function')p.catch(function(){});}catch(_){state.textContent='Waiting for the glasses…';}}
 function sendPrefs(){yawOut.value=yaw.value;pitchOut.value=pitch.value;send({type:'prefs',yawRange:Number(yaw.value),pitchRange:Number(pitch.value),invertX:invertX.checked,invertY:invertY.checked});}
 yaw.oninput=sendPrefs;pitch.oninput=sendPrefs;invertX.onchange=sendPrefs;invertY.onchange=sendPrefs;
 document.getElementById('recenter').onclick=function(){send({type:'recenter'});};
 document.getElementById('newGame').onclick=function(){send({type:'newGame'});};
 document.getElementById('fire').onclick=function(){send({type:'fire'});};
 function ensureWaters(){if(waters.childElementCount===100)return;waters.replaceChildren();for(var i=0;i<100;i++)waters.appendChild(document.createElement('i'));}
 function paintWaters(board){if(!board||board.length!==100)return;ensureWaters();for(var i=0;i<100;i++)waters.children[i].className='c'+board[i];}
 miraCompanion.onFromApp(function(m){if(!m)return;if(m.type==='stop'){state.textContent='Waiting for the glasses…';return;}if(m.type!=='state')return;
  state.textContent='Enemy ships: '+m.enemyShips+'   Your ships: '+m.yourShips+'\n'+'Shots: '+m.shots+'   Hits: '+m.hits+'\n'+(m.target||'')+'\n'+(m.noteA||m.last||'')+(m.noteB?'\n'+m.noteB:'');
  if(Number.isFinite(Number(m.yawRange))){yaw.value=String(m.yawRange);yawOut.value=yaw.value;}if(Number.isFinite(Number(m.pitchRange))){pitch.value=String(m.pitchRange);pitchOut.value=pitch.value;}if(m.invertX!=null)invertX.checked=!!m.invertX;if(m.invertY!=null)invertY.checked=!!m.invertY;paintWaters(m.yourBoard);
 });
 send({type:'sync'});
})();
</script>
