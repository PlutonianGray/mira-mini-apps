<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script type="application/mira-manifest+json">
  { "title": "Minesweeper", "description": "Classic Minesweeper for Mira glasses with ring, touch-bar, head selection, or phone controls.", "phoneIcon": "star" }
  </script>
  <style>
    :root { color-scheme: light; --ink:#163b20; --green:#1d7134; --soft:#edf7ef; --line:#bad7c0; --warn:#a83f32; }
    * { box-sizing:border-box; }
    body { margin:0; padding:18px; font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#f5faf6; }
    #mira-companion-root { max-width:520px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:24px; }
    .sub { margin:0 0 15px; color:#64806a; }
    .topbar, .actions, .head-controls { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
    button, input { min-height:42px; font:inherit; }
    button { padding:10px 13px; border:0; border-radius:10px; color:#fff; background:var(--green); font-weight:650; }
    button.secondary { color:var(--ink); background:#e3f1e6; }
    button:active { transform:translateY(1px); }
    #board { display:grid; grid-template-columns:repeat(9,1fr); aspect-ratio:1; margin:16px 0; border:3px solid var(--ink); background:#fff; }
    .cell { min-width:0; min-height:0; padding:0; border:0 solid #9fb9a4; border-right-width:1px; border-bottom-width:1px; border-radius:0; color:var(--green); background:#d7e8db; font-size:clamp(15px,5vw,22px); font-weight:700; }
    .cell:nth-child(9n) { border-right-width:0; }
    .cell.revealed { color:var(--ink); background:#fff; font-weight:600; }
    .cell.selected { outline:3px solid var(--green); outline-offset:-3px; }
    .cell.mine { color:#fff; background:var(--warn); }
    .cell.flag { color:var(--warn); background:#f3e4c8; }
    .cell.wrong { color:var(--warn); background:#fff0ed; }
    #status { min-height:48px; margin:12px 0; padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:#fff; white-space:pre-line; }
    .head-card { margin-top:14px; padding:13px; border-radius:12px; background:var(--soft); }
    .head-card .title-row { display:flex; gap:8px; align-items:center; font-weight:650; }
    .head-controls { margin-top:10px; }
    .head-controls label { display:block; flex:1; min-width:135px; font-weight:400; }
    input[type="range"] { width:100%; min-height:30px; accent-color:var(--green); }
    .toggles { display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }
    .toggles label { display:flex; gap:6px; align-items:center; font-weight:400; }
    .fine { margin:10px 0 0; color:#64806a; font-size:13px; line-height:1.4; }
  </style>
</head>
<body>
<main id="mira-companion-root">
  <h1>Minesweeper</h1>
  <p class="sub">9×9 beginner field. Play on the glasses or use this screen as backup controls.</p>
  <div class="topbar">
    <button id="new" type="button">New game</button>
    <button id="flag" class="secondary" type="button">Flag cell</button>
    <button id="reveal" class="secondary" type="button">Reveal</button>
  </div>
  <div id="board" aria-label="Minesweeper board"></div>
  <div id="status">Waiting for the glasses...</div>
  <section class="head-card">
    <label class="title-row"><input id="head" type="checkbox" checked> Select cells by head position</label>
    <div class="head-controls">
      <label>Horizontal range <span id="yawValue">30</span> degrees<input id="yaw" type="range" min="16" max="50" value="30"></label>
      <label>Vertical range <span id="pitchValue">24</span> degrees<input id="pitch" type="range" min="14" max="40" value="24"></label>
      <button id="recenter" class="secondary" type="button">Recenter</button>
    </div>
    <div class="toggles">
      <label><input id="invertX" type="checkbox"> Invert left/right</label>
      <label><input id="invertY" type="checkbox"> Invert up/down</label>
    </div>
    <p class="fine">Tap a covered cell to reveal it. Flag marks a mine. Recenter while looking straight ahead.</p>
  </section>
</main>
<script>
(function () {
  var boardEl = document.getElementById('board');
  var headEl = document.getElementById('head');
  var yawEl = document.getElementById('yaw');
  var pitchEl = document.getElementById('pitch');
  var invertXEl = document.getElementById('invertX');
  var invertYEl = document.getElementById('invertY');
  var statusEl = document.getElementById('status');

  function send(message) {
    if (typeof miraCompanion !== 'undefined' && miraCompanion.sendToApp) {
      miraCompanion.sendToApp(message);
    } else {
      statusEl.textContent = 'Waiting for the glasses...';
    }
  }

  for (var i = 0; i < 81; i++) {
    var cell = document.createElement('button');
    cell.className = 'cell';
    cell.type = 'button';
    cell.dataset.index = String(i);
    cell.setAttribute('aria-label', 'Row ' + (Math.floor(i / 9) + 1) + ', column ' + (i % 9 + 1));
    cell.onclick = function () { send({ type:'select', index:Number(this.dataset.index) }); };
    boardEl.appendChild(cell);
  }

  function redrawPhone(state) {
    headEl.checked = state.headSelect !== false;
    yawEl.value = String(state.yawRange || 30);
    pitchEl.value = String(state.pitchRange || 24);
    invertXEl.checked = !!state.invertX;
    invertYEl.checked = !!state.invertY;
    document.getElementById('yawValue').textContent = String(state.yawRange || 30);
    document.getElementById('pitchValue').textContent = String(state.pitchRange || 24);
    var grid = state.board || '';
    Array.prototype.forEach.call(boardEl.children, function (cell, index) {
      var mark = grid.charAt(index) || '.';
      cell.textContent = mark === '.' || mark === '_' ? '' : (mark === 'F' ? 'F' : (mark === '*' ? '*' : (mark === 'x' ? 'X' : mark)));
      cell.className = 'cell' +
        (index === state.selected ? ' selected' : '') +
        (mark === 'F' ? ' flag' : '') +
        (mark === '*' ? ' mine' : '') +
        (mark === 'x' ? ' wrong' : '') +
        (mark !== '.' && mark !== 'F' ? ' revealed' : '');
    });
    statusEl.textContent = (state.status || 'Ready') + '\nMines left ' + (state.minesLeft != null ? state.minesLeft : 10) +
      ' · Revealed ' + (state.revealed || 0) + '/' + (state.safeCells || 71);
  }

  document.getElementById('new').onclick = function () { send({ type:'newGame' }); };
  document.getElementById('flag').onclick = function () { send({ type:'flag' }); };
  document.getElementById('reveal').onclick = function () { send({ type:'reveal' }); };
  document.getElementById('recenter').onclick = function () { send({ type:'recenter' }); };
  headEl.onchange = function () { send({ type:'settings', pointerEnabled:headEl.checked }); };
  function sendHeadConfig() {
    document.getElementById('yawValue').textContent = yawEl.value;
    document.getElementById('pitchValue').textContent = pitchEl.value;
    send({ type:'settings', yawRange:Number(yawEl.value), pitchRange:Number(pitchEl.value) });
  }
  yawEl.onchange = sendHeadConfig;
  pitchEl.onchange = sendHeadConfig;
  function sendInvert() { send({ type:'settings', invertX:invertXEl.checked, invertY:invertYEl.checked }); }
  invertXEl.onchange = sendInvert;
  invertYEl.onchange = sendInvert;

  if (typeof miraCompanion !== 'undefined' && miraCompanion.onFromApp) {
    miraCompanion.onFromApp(function (message) {
      if (!message) return;
      if (message.type === 'state') redrawPhone(message);
      if (message.type === 'stop') statusEl.textContent = 'Waiting for the glasses...';
    });
    send({type:'sync'});
  }
})();
</script>
