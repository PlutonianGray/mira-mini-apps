<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <script type="application/mira-manifest+json">
  {
    "title": "Fleet Grid",
    "description": "A Battleship-style strategy game for Mira glasses.",
    "phoneIcon": "navigate"
  }
  </script>

  <style>
    :root {
      --ink: #173c20;
      --muted: #66846b;
      --line: #c5dfc7;
      --paper: #f3faf4;
      --card: #fff;
      --forest: #1c7133;
      --water: #e4f0e6;
      --hit: #0e3a1a;
    }

    body {
      margin: 0;
      padding: 18px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      font: 16px -apple-system, system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.35;
    }

    .card {
      max-width: 520px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 12px 0 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--forest);
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }

    label {
      font-weight: 600;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
    }

    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 12px;
      background: var(--forest);
      color: #fff;
      font: inherit;
      font-weight: 700;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .buttons #fire { grid-column: 1 / -1; }

    #state {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: var(--paper);
      white-space: pre-wrap;
      line-height: 1.35;
    }

    .waters-wrap {
      margin-top: 16px;
    }

    .waters-wrap h2 {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .waters {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      width: min(100%, 280px);
    }

    .waters i {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--water);
      display: block;
    }

    .waters i.c1 { background: var(--forest); }
    .waters i.c2 { background: #c5d7c8; }
    .waters i.c3 { background: var(--hit); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .legend .ship { background: var(--forest); }
    .legend .miss { background: #c5d7c8; }
    .legend .hit { background: var(--hit); }

    small {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main id="mira-companion-root">
    <div class="card">
      <h1>Fleet Grid</h1>
      <p>
        Head-aim at the enemy grid and tap to fire. Swipe to step cell by cell.
        Long-press on the glasses to recenter head aiming.
      </p>

      <div class="row">
        <label for="yaw">Horizontal head span</label>
        <span><output id="yawOut">30</output>°</span>
      </div>
      <input id="yaw" type="range" min="18" max="50" step="1" value="30">

      <div class="row">
        <label for="pitch">Vertical head span</label>
        <span><output id="pitchOut">24</output>°</span>
      </div>
      <input id="pitch" type="range" min="14" max="40" step="1" value="24">

      <div class="checks">
        <label><input id="invertX" type="checkbox"> Invert X</label>
        <label><input id="invertY" type="checkbox"> Invert Y</label>
      </div>

      <div class="buttons">
        <button id="recenter" type="button">Recenter Aim</button>
        <button id="newGame" type="button">New Game</button>
        <button id="fire" type="button">Fire</button>
      </div>

      <div id="state">Waiting for the glasses…</div>

      <div class="waters-wrap">
        <h2>Your waters</h2>
        <div id="waters" class="waters" aria-label="Your fleet and incoming fire"></div>
        <div class="legend">
          <span><i class="ship"></i> Ship</span>
          <span><i class="hit"></i> Hit</span>
          <span><i class="miss"></i> Miss</span>
        </div>
      </div>

      <p style="margin-top:14px">
        <small>Your fleet is auto-placed each game. Standard ship sizes: 5, 4, 3, 3, 2.</small>
      </p>
    </div>
  </main>

  <script>
    (function () {
      var yaw = document.getElementById('yaw');
      var pitch = document.getElementById('pitch');
      var invertX = document.getElementById('invertX');
      var invertY = document.getElementById('invertY');
      var yawOut = document.getElementById('yawOut');
      var pitchOut = document.getElementById('pitchOut');
      var state = document.getElementById('state');
      var waters = document.getElementById('waters');

      function send(message) {
        if (typeof miraCompanion !== 'undefined' && miraCompanion.sendToApp) {
          miraCompanion.sendToApp(message);
        } else {
          state.textContent = 'Waiting for the glasses…';
        }
      }

      function sendPrefs() {
        yawOut.value = yaw.value;
        pitchOut.value = pitch.value;
        send({
          type: 'prefs',
          yawRange: Number(yaw.value),
          pitchRange: Number(pitch.value),
          invertX: invertX.checked,
          invertY: invertY.checked
        });
      }

      yaw.oninput = sendPrefs;
      pitch.oninput = sendPrefs;
      invertX.onchange = sendPrefs;
      invertY.onchange = sendPrefs;

      document.getElementById('recenter').onclick = function () {
        send({ type: 'recenter' });
      };

      document.getElementById('newGame').onclick = function () {
        send({ type: 'newGame' });
      };

      document.getElementById('fire').onclick = function () {
        send({ type: 'fire' });
      };

      function ensureWaters() {
        if (waters.childElementCount === 100) return;
        waters.replaceChildren();
        for (var i = 0; i < 100; i++) {
          waters.appendChild(document.createElement('i'));
        }
      }

      function paintWaters(board) {
        if (!board || board.length !== 100) return;
        ensureWaters();
        for (var i = 0; i < 100; i++) {
          waters.children[i].className = 'c' + board[i];
        }
      }

      if (typeof miraCompanion !== 'undefined' && miraCompanion.onFromApp) {
        miraCompanion.onFromApp(function (m) {
          if (!m) return;
          if (m.type === 'stop') {
            state.textContent = 'Waiting for the glasses…';
            return;
          }
          if (m.type !== 'state') return;

          state.textContent =
            'Enemy ships: ' + m.enemyShips + '   Your ships: ' + m.yourShips + '\n' +
            'Shots: ' + m.shots + '   Hits: ' + m.hits + '\n' +
            (m.target || '') + '\n' +
            (m.noteA || m.last || '') + (m.noteB ? '\n' + m.noteB : '');

          if (Number.isFinite(Number(m.yawRange))) {
            yaw.value = String(m.yawRange);
            yawOut.value = yaw.value;
          }
          if (Number.isFinite(Number(m.pitchRange))) {
            pitch.value = String(m.pitchRange);
            pitchOut.value = pitch.value;
          }
          if (m.invertX != null) invertX.checked = !!m.invertX;
          if (m.invertY != null) invertY.checked = !!m.invertY;

          paintWaters(m.yourBoard);
        });
      }
    })();
  </script>

  <script type="mira-app">
    (function () {
      var INK = 15;
      var MID = 8;
      var DIM = 5;
      var SIZE = 10;
      var CELL = 30;
      var GX = 62;
      var GY = 90;
      var SHIP_SIZES = [5, 4, 3, 3, 2];
      var LETTERS = 'ABCDEFGHIJ';

      var enemyFleet;
      var playerFleet;
      var playerShots;
      var enemyShots;
      var cursorRow = 5;
      var cursorCol = 5;
      var shotsTaken = 0;
      var hitsMade = 0;
      var noteA = 'SINK THE ENEMY';
      var noteB = 'FLEET.';
      var gameOver = false;
      var aiQueue = [];
      var controlMode = 'head';

      var yawRange = 30;
      var pitchRange = 24;
      var invertX = false;
      var invertY = false;
      var pointer = {
        baseYaw: null,
        basePitch: null,
        x: 320,
        y: 240
      };

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function wrap(d) {
        while (d > 180) d -= 360;
        while (d < -180) d += 360;
        return d;
      }

      function coord(i) {
        var r = Math.floor(i / SIZE);
        var c = i % SIZE;
        return LETTERS.charAt(c) + String(r + 1);
      }

      function indexOfCell(r, c) {
        return r * SIZE + c;
      }

      function shuffled(v) {
        var o = v.slice();

        for (var i = o.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = o[i];
          o[i] = o[j];
          o[j] = t;
        }

        return o;
      }

      function tryPlaceFleet() {
        var cells = [];
        var ships = [];
        var i;

        for (i = 0; i < SIZE * SIZE; i++) {
          cells.push(-1);
        }

        for (var s = 0; s < SHIP_SIZES.length; s++) {
          var len = SHIP_SIZES[s];
          var placed = false;
          var attempts = 0;

          while (!placed && attempts < 240) {
            attempts++;
            var h = Math.random() < 0.5;
            var maxR = h ? SIZE : SIZE - len + 1;
            var maxC = h ? SIZE - len + 1 : SIZE;
            var row = Math.floor(Math.random() * maxR);
            var col = Math.floor(Math.random() * maxC);
            var chosen = [];
            var clear = true;
            var k;

            for (k = 0; k < len; k++) {
              var rr = row + (h ? 0 : k);
              var cc = col + (h ? k : 0);
              var idx = indexOfCell(rr, cc);

              if (cells[idx] !== -1) {
                clear = false;
                break;
              }

              chosen.push(idx);
            }

            if (!clear) continue;

            var id = ships.length;

            for (k = 0; k < chosen.length; k++) {
              cells[chosen[k]] = id;
            }

            ships.push({
              size: len,
              cells: chosen,
              hits: 0,
              sunk: false
            });

            placed = true;
          }

          if (!placed) return null;
        }

        return {
          cells: cells,
          ships: ships
        };
      }

      function fallbackFleet() {
        var cells = [];
        var ships = [];
        var rows = [0, 2, 4, 6, 8];

        for (var i = 0; i < SIZE * SIZE; i++) {
          cells.push(-1);
        }

        for (var s = 0; s < SHIP_SIZES.length; s++) {
          var len = SHIP_SIZES[s];
          var chosen = [];
          var id = ships.length;

          for (var c = 0; c < len; c++) {
            var idx = indexOfCell(rows[s], c);
            cells[idx] = id;
            chosen.push(idx);
          }

          ships.push({
            size: len,
            cells: chosen,
            hits: 0,
            sunk: false
          });
        }

        return {
          cells: cells,
          ships: ships
        };
      }

      function placeFleet() {
        for (var n = 0; n < 40; n++) {
          var fleet = tryPlaceFleet();
          if (fleet) return fleet;
        }

        return fallbackFleet();
      }

      function shipsRemaining(f) {
        var n = 0;
        var i;

        for (i = 0; i < f.ships.length; i++) {
          if (!f.ships[i].sunk) n++;
        }

        return n;
      }

      function attack(f, m, idx) {
        if (!Number.isFinite(idx) || Math.floor(idx) !== idx || idx < 0 || idx >= SIZE * SIZE) {
          return { kind: 'none', index: -1, sunk: false };
        }

        if (m[idx]) {
          return {
            kind: 'repeat',
            index: idx,
            sunk: false
          };
        }

        var id = f.cells[idx];

        if (id < 0) {
          m[idx] = 1;
          return {
            kind: 'miss',
            index: idx,
            sunk: false
          };
        }

        m[idx] = 2;
        var s = f.ships[id];
        s.hits++;

        if (s.hits >= s.size) {
          s.sunk = true;
        }

        return {
          kind: 'hit',
          index: idx,
          sunk: s.sunk,
          shipSize: s.size
        };
      }

      function addAiNeighbors(idx) {
        var r = Math.floor(idx / SIZE);
        var c = idx % SIZE;
        var a = [];

        if (r > 0) a.push(indexOfCell(r - 1, c));
        if (r < SIZE - 1) a.push(indexOfCell(r + 1, c));
        if (c > 0) a.push(indexOfCell(r, c - 1));
        if (c < SIZE - 1) a.push(indexOfCell(r, c + 1));

        a = shuffled(a);

        var i;
        for (i = 0; i < a.length; i++) {
          if (!enemyShots[a[i]] && aiQueue.indexOf(a[i]) < 0) {
            aiQueue.push(a[i]);
          }
        }
      }

      function rebuildHuntQueue() {
        aiQueue = [];
        var i;

        for (i = 0; i < SIZE * SIZE; i++) {
          if (enemyShots[i] !== 2) continue;
          var id = playerFleet.cells[i];
          if (id >= 0 && !playerFleet.ships[id].sunk) {
            addAiNeighbors(i);
          }
        }
      }

      function chooseAiShot() {
        while (aiQueue.length) {
          var q = aiQueue.shift();
          if (!enemyShots[q]) return q;
        }

        var parity = [];
        var any = [];
        var i;

        for (i = 0; i < SIZE * SIZE; i++) {
          if (enemyShots[i]) continue;

          any.push(i);

          var r = Math.floor(i / SIZE);
          var c = i % SIZE;

          if ((r + c) % 2 === 0) {
            parity.push(i);
          }
        }

        var pool = parity.length ? parity : any;
        if (!pool.length) return -1;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function computerTurn() {
        var idx = chooseAiShot();

        if (idx < 0) {
          return { kind: 'none', index: -1, sunk: false };
        }

        var r = attack(playerFleet, enemyShots, idx);

        if (r.kind === 'hit' && !r.sunk) {
          addAiNeighbors(idx);
        }

        if (r.sunk) {
          rebuildHuntQueue();
        }

        return r;
      }

      function recaptureHead() {
        pointer.baseYaw = null;
        pointer.basePitch = null;
        pointer.x = 320;
        pointer.y = 240;
        controlMode = 'head';
      }

      function resetPointer() {
        recaptureHead();
        cursorRow = 5;
        cursorCol = 5;
      }

      function yourBoard() {
        var board = [];
        var i;

        for (i = 0; i < SIZE * SIZE; i++) {
          if (enemyShots[i] === 1) board.push(2);
          else if (enemyShots[i] === 2) board.push(3);
          else if (playerFleet.cells[i] >= 0) board.push(1);
          else board.push(0);
        }

        return board;
      }

      function lastJoined() {
        return noteB ? noteA + ' ' + noteB : noteA;
      }

      function targetLabel() {
        if (gameOver) return 'TAP TO RESTART';
        var mode = controlMode === 'head' ? 'HEAD' : 'SWIPE';
        return mode + '  ' + LETTERS.charAt(cursorCol) + String(cursorRow + 1);
      }

      function newGame() {
        enemyFleet = placeFleet();
        playerFleet = placeFleet();
        playerShots = [];
        enemyShots = [];

        var i;
        for (i = 0; i < SIZE * SIZE; i++) {
          playerShots.push(0);
          enemyShots.push(0);
        }

        shotsTaken = 0;
        hitsMade = 0;
        noteA = 'SINK THE ENEMY';
        noteB = 'FLEET.';
        gameOver = false;
        aiQueue = [];

        resetPointer();
        render();
        publish();
      }

      function updateHeadPointer() {
        if (controlMode !== 'head' || gameOver) return false;

        var imu = miraCanvas.getIMU();
        var att = imu && imu.attitude;
        var ageMs = Number(imu && imu.ageMs);

        if (
          !imu ||
          !imu.available ||
          !Number.isFinite(ageMs) ||
          ageMs < 0 ||
          ageMs > 1600 ||
          !att
        ) {
          return false;
        }

        var yaw = Number.isFinite(Number(att.z_yaw))
          ? Number(att.z_yaw)
          : Number(att.z);

        var pitch = Number.isFinite(Number(att.y_pitch))
          ? Number(att.y_pitch)
          : Number(att.y);

        if (!Number.isFinite(yaw) || !Number.isFinite(pitch)) {
          return false;
        }

        if (pointer.baseYaw == null) {
          pointer.baseYaw = yaw;
          pointer.basePitch = pitch;
          pointer.x = 320;
          pointer.y = 240;
          return false;
        }

        var tx = clamp(
          320 + (invertX ? -1 : 1) * wrap(yaw - pointer.baseYaw) * 640 / yawRange,
          0,
          640
        );

        var ty = clamp(
          240 + (invertY ? -1 : 1) * (pitch - pointer.basePitch) * 480 / pitchRange,
          0,
          480
        );

        pointer.x += (tx - pointer.x) * 0.35;
        pointer.y += (ty - pointer.y) * 0.35;

        var nc = clamp(Math.round(pointer.x * (SIZE - 1) / 640), 0, SIZE - 1);
        var nr = clamp(Math.round(pointer.y * (SIZE - 1) / 480), 0, SIZE - 1);

        if (nc === cursorCol && nr === cursorRow) {
          return false;
        }

        cursorCol = nc;
        cursorRow = nr;
        return true;
      }

      function buildChrome() {
        return {
          kind: 'rect',
          x: 0,
          y: 0,
          w: 0,
          h: 0,
          stroke: 0,
          strokeWidth: 0,
          children: {
            'fleet:chrome:title': {
              kind: 'text',
              x: 36,
              y: 10,
              w: 236,
              h: 40,
              text: 'FLEET GRID',
              fill: INK,
              fontSize: 32
            },
            'fleet:chrome:hint': {
              kind: 'text',
              x: 284,
              y: 16,
              w: 320,
              h: 26,
              padding: 0,
              text: 'TAP FIRE | HOLD CENTER',
              align: 'right',
              fill: MID,
              fontSize: 18
            },
            'fleet:chrome:rule': {
              kind: 'line',
              x1: 36,
              y1: 56,
              x2: 604,
              y2: 56,
              stroke: MID,
              strokeWidth: 1
            }
          }
        };
      }

      function buildGrid() {
        var ch = {};
        var i;

        for (i = 0; i <= SIZE; i++) {
          ch['fleet:grid:v:' + i] = {
            kind: 'line',
            x1: GX + i * CELL,
            y1: GY,
            x2: GX + i * CELL,
            y2: GY + SIZE * CELL,
            stroke: MID,
            strokeWidth: 1
          };

          ch['fleet:grid:h:' + i] = {
            kind: 'line',
            x1: GX,
            y1: GY + i * CELL,
            x2: GX + SIZE * CELL,
            y2: GY + i * CELL,
            stroke: MID,
            strokeWidth: 1
          };
        }

        for (i = 0; i < SIZE; i++) {
          ch['fleet:grid:col:' + i] = {
            kind: 'text',
            x: GX + i * CELL,
            y: 62,
            w: CELL,
            h: 26,
            text: LETTERS.charAt(i),
            align: 'center',
            fill: MID,
            fontSize: 18
          };

          ch['fleet:grid:row:' + i] = {
            kind: 'text',
            x: 22,
            y: GY + i * CELL + 5,
            w: 34,
            h: 26,
            text: String(i + 1),
            align: 'right',
            fill: MID,
            fontSize: 18
          };
        }

        return {
          kind: 'rect',
          x: 0,
          y: 0,
          w: 0,
          h: 0,
          stroke: 0,
          strokeWidth: 0,
          children: ch
        };
      }

      function buildShots() {
        var ch = {};
        var i;

        for (i = 0; i < SIZE * SIZE; i++) {
          if (!playerShots[i]) continue;

          var r = Math.floor(i / SIZE);
          var c = i % SIZE;
          var x = GX + c * CELL;
          var y = GY + r * CELL;

          if (playerShots[i] === 1) {
            ch['fleet:shots:miss:' + i] = {
              kind: 'circle',
              cx: x + 15,
              cy: y + 15,
              r: 4,
              stroke: DIM,
              strokeWidth: 2
            };
          } else {
            ch['fleet:shots:hit:a:' + i] = {
              kind: 'line',
              x1: x + 7,
              y1: y + 7,
              x2: x + 23,
              y2: y + 23,
              stroke: INK,
              strokeWidth: 3
            };

            ch['fleet:shots:hit:b:' + i] = {
              kind: 'line',
              x1: x + 23,
              y1: y + 7,
              x2: x + 7,
              y2: y + 23,
              stroke: INK,
              strokeWidth: 3
            };
          }
        }

        return {
          kind: 'rect',
          x: 0,
          y: 0,
          w: 0,
          h: 0,
          stroke: 0,
          strokeWidth: 0,
          children: ch
        };
      }

      function buildCursor() {
        var x = GX + cursorCol * CELL + 2;
        var y = GY + cursorRow * CELL + 2;

        return {
          kind: 'rect',
          x: x,
          y: y,
          w: CELL - 4,
          h: CELL - 4,
          cornerRadius: 5,
          stroke: INK,
          strokeWidth: 3
        };
      }

      function buildSidebar() {
        return {
          kind: 'rect',
          x: 0,
          y: 0,
          w: 0,
          h: 0,
          stroke: 0,
          strokeWidth: 0,
          children: {
            'fleet:side:enemyLabel': {
              kind: 'text',
              x: 380,
              y: 96,
              w: 224,
              h: 26,
              text: 'ENEMY SHIPS',
              fill: MID,
              fontSize: 18
            },
            'fleet:side:enemyValue': {
              kind: 'text',
              x: 380,
              y: 130,
              w: 224,
              h: 40,
              text: String(shipsRemaining(enemyFleet)),
              fill: INK,
              fontSize: 32
            },
            'fleet:side:youLabel': {
              kind: 'text',
              x: 380,
              y: 178,
              w: 224,
              h: 26,
              text: 'YOUR SHIPS',
              fill: MID,
              fontSize: 18
            },
            'fleet:side:youValue': {
              kind: 'text',
              x: 380,
              y: 212,
              w: 224,
              h: 40,
              text: String(shipsRemaining(playerFleet)),
              fill: INK,
              fontSize: 32
            },
            'fleet:side:stats': {
              kind: 'text',
              x: 380,
              y: 264,
              w: 224,
              h: 26,
              text: shotsTaken + ' SHOTS   ' + hitsMade + ' HITS',
              fill: MID,
              fontSize: 18
            },
            'fleet:side:last': {
              kind: 'text',
              x: 380,
              y: 294,
              w: 224,
              h: 60,
              padding: 0,
              text: noteA + '\n' + noteB,
              fill: INK,
              fontSize: 18,
              lineSpacing: 30
            },
            'fleet:side:target': {
              kind: 'text',
              x: 380,
              y: 364,
              w: 224,
              h: 26,
              text: targetLabel(),
              fill: INK,
              fontSize: 18
            }
          }
        };
      }

      function render() {
        miraCanvas.draw('fleet:chrome', buildChrome());
        miraCanvas.draw('fleet:grid', buildGrid());
        miraCanvas.draw('fleet:shots', buildShots());
        miraCanvas.draw('fleet:cursor', buildCursor());
        miraCanvas.draw('fleet:sidebar', buildSidebar());
      }

      function publish() {
        if (typeof miraCompanion === 'undefined' || !miraCompanion.sendToCompanion) return;
        miraCompanion.sendToCompanion({
          type: 'state',
          enemyShips: shipsRemaining(enemyFleet),
          yourShips: shipsRemaining(playerFleet),
          shots: shotsTaken,
          hits: hitsMade,
          last: lastJoined(),
          noteA: noteA,
          noteB: noteB,
          gameOver: gameOver,
          yourBoard: yourBoard(),
          selected: indexOfCell(cursorRow, cursorCol),
          target: targetLabel(),
          headSelect: controlMode === 'head',
          yawRange: yawRange,
          pitchRange: pitchRange,
          invertX: invertX,
          invertY: invertY
        });
      }

      function enemyLine(result) {
        if (!result || result.kind === 'none') {
          return 'ENEMY HAS NO SHOT.';
        }

        if (result.kind === 'hit') {
          return result.sunk
            ? 'ENEMY SANK A SHIP.'
            : 'ENEMY HIT ' + coord(result.index) + '.';
        }

        return 'ENEMY MISS ' + coord(result.index) + '.';
      }

      function fire() {
        if (gameOver) {
          newGame();
          return;
        }

        var idx = indexOfCell(cursorRow, cursorCol);
        var mine = attack(enemyFleet, playerShots, idx);

        if (mine.kind === 'none') {
          noteA = 'INVALID TARGET.';
          noteB = 'PICK A NEW CELL.';
          render();
          publish();
          return;
        }

        if (mine.kind === 'repeat') {
          noteA = 'ALREADY ' + coord(idx) + '.';
          noteB = 'PICK A NEW CELL.';
          render();
          publish();
          return;
        }

        shotsTaken++;

        if (mine.kind === 'hit') {
          hitsMade++;
          noteA = mine.sunk
            ? 'HIT ' + coord(idx) + '. SUNK.'
            : 'HIT ' + coord(idx) + '.';
        } else {
          noteA = 'MISS ' + coord(idx) + '.';
        }

        if (shipsRemaining(enemyFleet) === 0) {
          noteA = 'YOU WIN.';
          noteB = 'ENEMY FLEET SUNK.';
          gameOver = true;
          render();
          publish();
          return;
        }

        var theirs = computerTurn();
        noteB = enemyLine(theirs);

        if (shipsRemaining(playerFleet) === 0) {
          noteA = 'FLEET LOST.';
          noteB = 'TAP TO START.';
          gameOver = true;
        }

        render();
        publish();
      }

      function manualStep(delta) {
        if (gameOver) return;

        controlMode = 'manual';

        var idx = indexOfCell(cursorRow, cursorCol);
        idx = (idx + delta + SIZE * SIZE) % (SIZE * SIZE);
        cursorRow = Math.floor(idx / SIZE);
        cursorCol = idx % SIZE;

        render();
        publish();
      }

      function nudge(dx, dy) {
        if (gameOver) return;

        dx = Number(dx);
        dy = Number(dy);
        dx = Number.isFinite(dx) ? clamp(Math.round(dx), -1, 1) : 0;
        dy = Number.isFinite(dy) ? clamp(Math.round(dy), -1, 1) : 0;

        if (!dx && !dy) return;

        controlMode = 'manual';
        cursorRow = clamp(cursorRow + dy, 0, SIZE - 1);
        cursorCol = clamp(cursorCol + dx, 0, SIZE - 1);
        render();
        publish();
      }

      miraCanvas.createPage({ width: 640, height: 480 });
      newGame();

      var off = null;
      if (typeof miraCompanion !== 'undefined' && miraCompanion.onFromCompanion) {
      off = miraCompanion.onFromCompanion(function (m) {
        if (!m) return;

        if (m.type === 'prefs' || m.type === 'headConfig' || m.type === 'invert') {
          if (Number.isFinite(m.yawRange)) {
            yawRange = clamp(m.yawRange, 18, 50);
          }

          if (Number.isFinite(m.pitchRange)) {
            pitchRange = clamp(m.pitchRange, 14, 40);
          }

          if (m.invertX != null) {
            invertX = !!m.invertX;
          }

          if (m.invertY != null) {
            invertY = !!m.invertY;
          }

          recaptureHead();
          render();
          publish();
        } else if (m.type === 'recenter') {
          resetPointer();
          if (!gameOver) {
            noteA = 'HEAD AIM';
            noteB = 'CENTERED.';
          }
          render();
          publish();
        } else if (m.type === 'newGame' || (m.type === 'action' && m.action === 'new')) {
          newGame();
        } else if (m.type === 'fire' || (m.type === 'action' && m.action === 'act')) {
          fire();
        } else if (m.type === 'select') {
          var idx = Math.round(Number(m.index));
          if (Number.isFinite(idx) && idx >= 0 && idx < SIZE * SIZE) {
            controlMode = 'manual';
            cursorRow = Math.floor(idx / SIZE);
            cursorCol = idx % SIZE;
            if (m.fire) fire();
            else { render(); publish(); }
          }
        } else if (m.type === 'nudge') {
          nudge(m.dx, m.dy);
        }
      });
      }

      miraCanvas.onStop(function () {
        if (typeof off === 'function') off();
        if (typeof miraCompanion !== 'undefined' && miraCompanion.sendToCompanion) {
          miraCompanion.sendToCompanion({ type: 'stop' });
        }
      });

      miraCanvas.onInput(function (e) {
        if (!e || typeof e.type !== 'string') return;

        if (e.type === 'click') {
          fire();
        } else if (e.type === 'scrollTop') {
          manualStep(-1);
        } else if (e.type === 'scrollBottom') {
          manualStep(1);
        } else if (e.type === 'longClick') {
          resetPointer();
          if (!gameOver) {
            noteA = 'HEAD AIM';
            noteB = 'CENTERED.';
          }
          render();
          publish();
        } else if (e.type === 'clear') {
          render();
          publish();
        }
      });

      miraCanvas.animate(function () {
        if (updateHeadPointer()) {
          render();
          publish();
        }

        return true;
      });
    })();
  </script>
</body>
</html>
