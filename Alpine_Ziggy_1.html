<style>
body{margin:0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom));font:16px -apple-system,system-ui,sans-serif;color:#16391e;background:#f4faf5}
h1{margin:0 0 6px;font-size:22px}p{margin:0 0 14px;color:#607c65}.card{padding:14px;margin:0 0 12px;border:1px solid #c8dccb;border-radius:12px;background:#fff;max-width:620px}.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row label{flex:1}input[type=range]{width:100%;accent-color:#1c7133}button{min-height:42px;padding:10px 12px;border:0;border-radius:10px;background:#1c7133;color:#fff;font:inherit;font-weight:650}button.secondary{background:#e4f0e6;color:#16391e}#state,#tests{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.45}

<body>
<main id="mira-companion-root">
<h1>Alpine Ziggy 1</h1>
<p>Glasses remain the game screen. Use this panel only for steering setup and status.</p>
<div class="card">
<label for="yawRange">Head steering range: <strong id="yawValue">20</strong> deg</label>
<input id="yawRange" type="range" min="12" max="30" step="1" value="20">
<div class="row"><label><input id="invert" type="checkbox"> Invert left/right</label></div>
<div class="row"><button id="recenter" type="button">Recenter head steering</button><button id="start" type="button" class="secondary">Start / restart</button></div>
</div>
<div class="card"><strong>Game status</strong><div id="state">Waiting for glasses...</div></div>
<div class="card"><strong>Built-in tests</strong><div id="tests">Waiting for test report...</div></div>
</main>
<script>
(function(){
 var yaw=document.getElementById('yawRange'),yawValue=document.getElementById('yawValue'),invert=document.getElementById('invert'),state=document.getElementById('state'),tests=document.getElementById('tests');
 function send(message){try{var p=miraCompanion.sendToApp(message);if(p&&typeof p.catch==='function')p.catch(function(){});}catch(_){state.textContent='Waiting for glasses...';}}
 function sendSettings(){yawValue.textContent=yaw.value;send({type:'settings',yawRange:Number(yaw.value),invertX:!!invert.checked});}
 yaw.oninput=sendSettings;invert.onchange=sendSettings;
 document.getElementById('recenter').onclick=function(){send({type:'recenter'});};
 document.getElementById('start').onclick=function(){send({type:'start'});};
 miraCompanion.onFromApp(function(message){if(!message)return;if(message.type==='stop'){state.textContent='Waiting for glasses...';return;}if(message.type==='state'){
  state.textContent=message.state+'\nScore '+message.score+'   Best '+message.best+'\nSpeed '+message.speed;
  if(Number.isFinite(Number(message.yawRange))){yaw.value=String(message.yawRange);yawValue.textContent=yaw.value;}if(message.invertX!=null)invert.checked=!!message.invertX;
 }if(message.type==='tests')tests.textContent=message.summary;});
 send({type:'sync'});
})();
</script>
